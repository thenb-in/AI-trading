<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Defaults; react-helmet-async overrides per-route on public pages. -->
    <title>SalaryMitra — Time, Attendance & Payroll</title>
    <meta name="description" content="SalaryMitra — time, attendance and payroll for modern teams. Field-sales tracking, ADMS biometric integration, reports, HR. Installable on desktop and mobile." />
    <meta name="keywords" content="SalaryMitra, time tracking, attendance, payroll, HR, ADMS biometric, field sales" />
    <meta name="robots" content="index,follow,max-image-preview:large" />

    <!-- Favicons + PWA install icons. -->
    <link rel="icon" type="image/svg+xml" href="/icons/nbnext.svg" />
    <link rel="alternate icon" href="/icons/nbnext.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/nbnext.svg" />
    <link rel="mask-icon" href="/icons/nbnext.svg" color="#d32f2f" />

    <!-- PWA manifest + theme color. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#d32f2f" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#b71c1c" media="(prefers-color-scheme: dark)" />
    <!-- <meta name="color-scheme" content="light dark" /> -->

    <!-- iOS Safari PWA meta -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SalaryMitra" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Windows tile config -->
    <meta name="application-name" content="SalaryMitra" />
    <meta name="msapplication-TileColor" content="#d32f2f" />
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- OpenGraph + Twitter for link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SalaryMitra" />
    <meta property="og:title" content="SalaryMitra — Time, Attendance & Payroll" />
    <meta property="og:description" content="Time, attendance, and payroll for modern teams. Installable on mobile and desktop." />
    <meta property="og:image" content="/icons/nbnext.svg" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SalaryMitra" />
    <meta name="twitter:description" content="Time, attendance & payroll. Installable on mobile and desktop." />
    <meta name="twitter:image" content="/icons/nbnext.svg" />

    <!-- JSON-LD: Organization + SoftwareApplication schema for Google rich results. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "name": "NB Next",
          "url": "/",
          "logo": "/icons/nbnext.svg"
        },
        {
          "@type": "SoftwareApplication",
          "name": "SalaryMitra",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "Web, Windows, macOS, Linux, Android, iOS",
          "description": "Time, attendance, and payroll for modern teams. Field-sales tracking, ADMS biometric integration, reports, HR."
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Prerender content lands here at build time. SPA hydrates over it. -->
    </div>
    <noscript>
      <p style="padding:24px;font-family:system-ui,sans-serif;max-width:42rem;margin:auto">
        SalaryMitra needs JavaScript enabled to run. The basic content above is
        a static snapshot for search engines; the full experience requires a
        modern browser with JavaScript turned on.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
