<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Defaults; react-helmet-async overrides per-route on public pages. -->
    <title>SalaryMitra — Attendance & Payroll Platform</title>
    <meta name="description" content="SalaryMitra — attendance, payroll, admin, and reports for modern teams. Role-based access with installable mobile and desktop apps." />
    <meta name="keywords" content="SalaryMitra, attendance, payroll, admin, reports, role-based access, time tracking" />
    <meta name="robots" content="index,follow,max-image-preview:large" />

    <!-- Favicons + PWA install icons. -->
    <link rel="icon" type="image/svg+xml" href="/icons/nbnext.svg" />
    <link rel="alternate icon" href="/icons/nbnext.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/nbnext.svg" />
    <link rel="mask-icon" href="/icons/nbnext.svg" color="#2e7d32" />

    <!-- PWA manifest + theme color. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2e7d32" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b5e20" media="(prefers-color-scheme: dark)" />
    <!-- <meta name="color-scheme" content="light dark" /> -->

    <!-- iOS Safari PWA meta -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SalaryMitra" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Windows tile config -->
    <meta name="application-name" content="SalaryMitra" />
    <meta name="msapplication-TileColor" content="#2e7d32" />
    <meta name="msapplication-tap-highlight" content="no" />

    <!-- OpenGraph + Twitter for link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SalaryMitra" />
    <meta property="og:title" content="SalaryMitra — Attendance & Payroll Platform" />
    <meta property="og:description" content="Attendance, payroll, admin, and reports for modern teams. Installable on mobile and desktop." />
    <meta property="og:image" content="/icons/nbnext.svg" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SalaryMitra — Attendance & Payroll Platform" />
    <meta name="twitter:description" content="Attendance, payroll, admin, and reports for modern teams. Installable on mobile and desktop." />
    <meta name="twitter:image" content="/icons/nbnext.svg" />

    <!-- JSON-LD: Organization + SoftwareApplication schema for Google rich results. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "name": "SalaryMitra",
          "url": "/",
          "logo": "/icons/nbnext.svg"
        },
        {
          "@type": "SoftwareApplication",
          "name": "SalaryMitra",
          "applicationCategory": "BusinessApplication",
          "operatingSystem": "Web, Windows, macOS, Linux, Android, iOS",
          "description": "Attendance, payroll, admin, and reports for modern teams."
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Prerender content lands here at build time. SPA hydrates over it. -->
    </div>
    <noscript>
      <p style="padding:24px;font-family:system-ui,sans-serif;max-width:42rem;margin:auto">
        This app needs JavaScript enabled to run. The basic content above is a
        static snapshot for search engines; the full experience requires a
        modern browser with JavaScript turned on.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
