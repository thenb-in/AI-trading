name: Code Quality

on:
  push:
    branches:
      - main
      - master
      - test-ci
  pull_request:
    branches:
      - main
      - master

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache dependencies
        uses: actions/cache@v4
        id: cache-deps
        with:
          path: |
            node_modules
            app/node_modules
            app/client/node_modules
            app/server/node_modules
            startup/client/node_modules
            startup/server/node_modules
          key: quality-deps-${{ hashFiles('package-lock.json', 'app/package-lock.json', 'app/client/package-lock.json', 'app/server/package-lock.json', 'startup/client/package-lock.json', 'startup/server/package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm run i
        env:
          CI: true
          HUSKY: 0

  lint:
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            app/node_modules
            app/client/node_modules
            app/server/node_modules
            startup/client/node_modules
            startup/server/node_modules
          key: quality-deps-${{ hashFiles('package-lock.json', 'app/package-lock.json', 'app/client/package-lock.json', 'app/server/package-lock.json', 'startup/client/package-lock.json', 'startup/server/package-lock.json') }}

      - name: Run lint
        run: npm run lint
        env:
          CI: true

  duplications:
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            app/node_modules
            app/client/node_modules
            app/server/node_modules
            startup/client/node_modules
            startup/server/node_modules
          key: quality-deps-${{ hashFiles('package-lock.json', 'app/package-lock.json', 'app/client/package-lock.json', 'app/server/package-lock.json', 'startup/client/package-lock.json', 'startup/server/package-lock.json') }}

      - name: Check code duplication (jscpd)
        run: npm run check-duplicates
        env:
          CI: true
