name: Build Windows Docker Bundle

# Produces what a Windows site is handed: one self-contained application image
# (bytecode server + built client + portal + pinned Node) and the install kit
# from deploy/windows/docker/.
#
# Deliberately not part of builds.yml — the image build compiles the whole tree
# and both Vite bundles, which is far too heavy to run on every push. Cut it on
# release, or by hand from the Actions tab.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  windows_docker_bundle:
    runs-on: [self-hosted, Linux, X64]

    defaults:
      run:
        shell: bash

    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Resolve version + image tag
        id: meta
        run: |
          STARTUP_VERSION=$(jq -r .version package.json)
          SERVER_VERSION=$(jq -r .version app/server/package.json)
          CLIENT_VERSION=$(jq -r .version app/client/package.json)
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          APP_NAME=$(basename "$GITHUB_REPOSITORY")
          {
            echo "startup_version=$STARTUP_VERSION"
            echo "server_version=$SERVER_VERSION"
            echo "client_version=$CLIENT_VERSION"
            echo "short_sha=$SHORT_SHA"
            echo "full_sha=$COMMIT_SHA"
            echo "app_name=$APP_NAME"
            echo "image=salarymitra/server:v${STARTUP_VERSION}-${SHORT_SHA}"
            echo "bundle_name=${APP_NAME}-windows-docker-v${STARTUP_VERSION}-${SHORT_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Build the application image
        run: docker build -t "${{ steps.meta.outputs.image }}" .

      - name: Verify the image ships no server source
        # The point of the bytecode build is that .jsc ships and .js does not.
        # A build-bytecode.config.js regression (a layer dropped from `encrypt`)
        # is silent otherwise — it surfaces as readable source on a customer's
        # disk, which is precisely where we never look.
        #
        # Every compiled file is replaced by a three-line loader stub that
        # mentions bytenode, so "a .js without the word bytenode" is source.
        # Pruned: node_modules (third-party), the client bundles (minified JS by
        # nature), and the two trees that ship as plain JS on purpose —
        # startup/server/scripts (ops tooling: setup-env, license_install) and
        # app/server/standard_formulas (read as text by the formula sandbox).
        # The whole check runs inside one container — the file list never has to
        # cross the boundary, and a leak fails the step by exit code.
        run: |
          docker run --rm --entrypoint sh "${{ steps.meta.outputs.image }}" -c '
            set -eu
            find /srv/app \
              -name node_modules -prune -o \
              -path /srv/app/app/client -prune -o \
              -path /srv/app/startup/server/scripts -prune -o \
              -path /srv/app/app/server/standard_formulas -prune -o \
              -name "*.js" -print > /tmp/all.txt
            # formulaBuilder.js is the one declared copyAsJs escape hatch.
            xargs grep -L bytenode < /tmp/all.txt | grep -v formulaBuilder.js > /tmp/leaks.txt || true
            if [ -s /tmp/leaks.txt ]; then
              echo "Readable server source found in the shipped image:"
              cat /tmp/leaks.txt
              exit 1
            fi
            echo "OK - $(wc -l < /tmp/all.txt) .js files checked, all bytecode stubs."
          '

      - name: Record the runtime metadata
        id: runtime
        run: |
          NODE_VERSION=$(docker run --rm --entrypoint node "${{ steps.meta.outputs.image }}" -v)
          echo "node_version=$NODE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Stage the install kit
        run: |
          rm -rf _docker_bundle
          mkdir -p _docker_bundle
          cp -a deploy/windows/docker/. _docker_bundle/
          rm -f _docker_bundle/.gitignore
          cat > _docker_bundle/VERSION <<EOF
          startup_version=${{ steps.meta.outputs.startup_version }}
          client_version=${{ steps.meta.outputs.client_version }}
          server_version=${{ steps.meta.outputs.server_version }}
          commit=${{ steps.meta.outputs.full_sha }}
          short_sha=${{ steps.meta.outputs.short_sha }}
          app_name=${{ steps.meta.outputs.app_name }}
          built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          image=${{ steps.meta.outputs.image }}
          node_version=${{ steps.runtime.outputs.node_version }}
          EOF

      - name: Save the image alongside it
        # install.ps1 picks up the newest salarymitra-server-*.tar* in the folder.
        run: |
          docker save "${{ steps.meta.outputs.image }}" \
            | gzip -1 > "_docker_bundle/salarymitra-server-v${{ steps.meta.outputs.startup_version }}-${{ steps.meta.outputs.short_sha }}.tar.gz"
          ls -lh _docker_bundle/

      - name: Upload the Windows Docker bundle
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.bundle_name }}
          path: _docker_bundle/
          include-hidden-files: true
