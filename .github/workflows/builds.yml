name: Build and Upload Artifacts

on:
  push:
    branches:
      - main
      - master
      - test-ci
      - test-e2e

  pull_request:
    branches:
      - main
      - master

  release:
    types: [published]

  # Input-driven build: cut a bundle carrying only the interfaces a client
  # bought. Every other trigger builds `all` (see the gateway_build job).
  workflow_dispatch:
    inputs:
      interfaces:
        description: 'Gateway interfaces to bundle: "all", or a comma-separated subset (adms_server,biomax_server,lan_cosec_centra,lan_realtime,lan_zk,realtime_server,vyom_server).'
        required: true
        default: 'all'
        type: string
      platform:
        description: 'Build target. bytenode locks each .jsc to the OS+arch that compiled it, so this picks the runner AND tags the bundle. Windows sites normally run the linux bundle under Docker — pick windows_x64 only for a native Windows install.'
        required: true
        default: 'linux_x64'
        type: choice
        options:
          - linux_x64
          - windows_x64

env:
  # npm runs package scripts through cmd.exe on Windows, which cannot parse the
  # POSIX idioms our scripts use (`NODE_OPTIONS=... vite build`, `rm -rf`). A
  # root .npmrc does NOT cover this: npm reads the project .npmrc from the
  # nearest package.json, so `cd app/client && npm run build` never sees it.
  # The env var applies to every npm invocation at any cwd.
  NPM_CONFIG_SCRIPT_SHELL: bash

  # The one place the build target is declared. Non-dispatch triggers build
  # linux. The `env` context is not available in `runs-on` or in a called
  # workflow's `with:`, so setup republishes this (and the matching runner) as
  # job outputs and every other job reads it from there.
  PLATFORM: ${{ inputs.platform || 'linux_x64' }}

  # The one place the Node version is declared. bytenode locks each .jsc to this
  # exact V8 build; it is captured into the bundle's VERSION and read back at
  # deploy time — nothing downstream hardcodes it.
  NODE_VERSION: "22.22.2"

jobs:
  setup:
    runs-on: ${{ inputs.platform == 'windows_x64' && 'windows-latest' || 'ubuntu-latest' }}

    # git-bash on Windows runners, so every step below is the same POSIX shell
    # on all targets. Declared on each native job — `defaults` is per-job.
    defaults:
      run:
        shell: bash

    # The `env` context is not available in `jobs.<id>.with`, so the Node pin
    # is republished here for gateway_build to consume via `needs`. NODE_VERSION
    # above stays the single declaration.
    outputs:
      node_version: ${{ steps.pin.outputs.node_version }}
      platform: ${{ steps.pin.outputs.platform }}
      runner: ${{ steps.pin.outputs.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Publish build target + Node version pin
        id: pin
        run: |
          echo "node_version=${{ env.NODE_VERSION }}" >> "$GITHUB_OUTPUT"
          echo "platform=${{ env.PLATFORM }}" >> "$GITHUB_OUTPUT"
          if [ "${{ env.PLATFORM }}" = "windows_x64" ]; then
            echo "runner=windows-latest" >> "$GITHUB_OUTPUT"
          else
            echo "runner=ubuntu-latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache dependencies (github-hosted only)
        # Cache via GitHub backend is worth it on ephemeral cloud runners;
        # on self-hosted persistent runners the local ~/.npm + node_modules
        # already persist between runs, so we skip the network round-trip.
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v5
        id: cache-deps
        with:
          path: |
            node_modules
            app/node_modules
            app/client/node_modules
            app/server/node_modules
            startup/client/node_modules
            startup/server/node_modules
          key: build-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'app/package-lock.json', 'app/client/package-lock.json', 'app/server/package-lock.json', 'startup/client/package-lock.json', 'startup/server/package-lock.json') }}

      - name: Install dependencies
        # Self-hosted: cache step skipped → cache-hit output is '' → install runs.
        # github-hosted cache hit: install skipped. github-hosted cache miss: install runs.
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm run i
        env:
          CI: true
          HUSKY: 0

  client_build:
    needs: setup
    runs-on: ${{ needs.setup.outputs.runner }}

    defaults:
      run:
        shell: bash

    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore dependencies (github-hosted only)
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v5
        id: cache-deps
        with:
          path: |
            node_modules
            app/node_modules
            app/client/node_modules
            app/server/node_modules
            startup/client/node_modules
            startup/server/node_modules
          key: build-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'app/package-lock.json', 'app/client/package-lock.json', 'app/server/package-lock.json', 'startup/client/package-lock.json', 'startup/server/package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm run i
        env:
          CI: true
          HUSKY: 0

      - name: Set environment variables
        run: cp app/client/.env.example app/client/.env

      - name: Cache puppeteer Chrome download (github-hosted only)
        # Puppeteer's Chromium binary lives outside node_modules in
        # ~/.cache/puppeteer (~300MB). Cache it separately from node_modules
        # so the deps cache stays slim. On self-hosted runners the cache dir
        # persists between runs already, so the step is skipped there.
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v5
        id: cache-puppeteer
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-chrome-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('startup/client/package-lock.json') }}

      - name: Install Chrome for puppeteer
        # Idempotent: skips download if the version pinned by puppeteer is
        # already present in ~/.cache/puppeteer. Runs from startup/client
        # because that's where puppeteer is installed; the prerender script
        # resolves it from there at build time.
        working-directory: startup/client
        run: npx puppeteer browsers install chrome

      - name: Run build
        run: cd app/client && npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: client-build-artifact
          path: app/client/dist/
          include-hidden-files: true

  # ────────────────────────────────────────────────────────────────────
  # SALARYMITRA PORTAL (ios/) — standalone Vite SPA served at /salarymitra.
  # Self-contained: its own package-lock + node_modules (NOT part of the
  # root `npm run i` workspaces), so it installs and builds independently of
  # client_build. The dist is consumed by server_build, which drops it
  # under app/client/salarymitra/ so it deploys at $app/<app>/salarymitra/.
  # ────────────────────────────────────────────────────────────────────
  ios_build:
    needs: setup
    runs-on: ${{ needs.setup.outputs.runner }}

    defaults:
      run:
        shell: bash

    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache SalaryMitra dependencies (github-hosted only)
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v5
        id: cache-ios-deps
        with:
          path: ios/node_modules
          key: build-ios-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ios/package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-ios-deps.outputs.cache-hit != 'true'
        run: cd ios && npm ci
        env:
          CI: true
          HUSKY: 0

      - name: Set environment variables
        run: cp ios/.env.example ios/.env

      - name: Run build
        run: cd ios && npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-build-artifact
          path: ios/dist/
          include-hidden-files: true

  # ────────────────────────────────────────────────────────────────────
  # GATEWAY BYTECODE — delegated to gateway_builds.yml so the site bundle and
  # the standalone gateway artifact are cut by ONE build path. Only needs
  # setup, so it compiles in parallel with client_build/ios_build instead of
  # serially inside the server job as it used to.
  #
  # The server job consumes the artifact rather than rebuilding: app/server
  # require()s @nucleus and @biometric_interface/@adms/@biomax/@zkteco at load
  # time (e.g. src/models/index.js does `require('@biometric_interface/common/db')`),
  # so those compiled layers must land in the bundle or the server will not boot.
  #
  # `all` discovers every interface carrying a build-bytecode.config.js. A
  # workflow_dispatch run can pass a subset to ship only what a client bought.
  # ────────────────────────────────────────────────────────────────────
  gateway_build:
    needs: setup
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/gateway_builds.yml
    with:
      interfaces: ${{ inputs.interfaces || 'all' }}
      node_version: ${{ needs.setup.outputs.node_version }}
      platform_id: ${{ needs.setup.outputs.platform }}
      runner: ${{ needs.setup.outputs.runner }}

  # ────────────────────────────────────────────────────────────────────
  # SERVER BUILD + SITE BUNDLE — compiles the framework + app boot wrapper to
  # bytecode AND assembles the full deployable bundle (client + server bytecode
  # + portal + deploy scripts + docker kit) in one job.
  #
  # Runs on whichever runner `setup` resolved from the `platform` input:
  # bytenode bytecode is locked to the exact Node ABI + platform + arch it was
  # compiled with, so the runner IS the target. Guards below refuse to bundle if
  # the runner or the downloaded gateway artifact disagrees with that target.
  #
  # It needs client_build + ios_build so it can pull their artifacts into the
  # bundle; the trade-off is the bytecode compile no longer overlaps those two
  # (the job waits for them to finish before it starts). Because the compile and
  # the bundling happen on the same runner, there is no intermediate
  # server-build artifact — the bytecode is staged straight into _bundle/.
  # ────────────────────────────────────────────────────────────────────
  server_build:
    needs: [setup, client_build, ios_build, gateway_build]
    runs-on: ${{ needs.setup.outputs.runner }}

    defaults:
      run:
        shell: bash

    permissions:
      contents: write
      actions: write

    env:
      PLATFORM_ID: ${{ needs.setup.outputs.platform }}

    outputs:
      bundle_name: ${{ steps.meta.outputs.bundle_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore dependencies (github-hosted only)
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v5
        id: cache-deps
        with:
          path: |
            node_modules
            app/node_modules
            app/client/node_modules
            app/server/node_modules
            startup/client/node_modules
            startup/server/node_modules
          key: build-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'app/package-lock.json', 'app/client/package-lock.json', 'app/server/package-lock.json', 'startup/client/package-lock.json', 'startup/server/package-lock.json') }}

      - name: Install dependencies
        # Self-hosted: always installs (relies on persistent ~/.npm).
        # github-hosted: installs on cache miss.
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm run i
        env:
          CI: true
          HUSKY: 0

      - name: Build framework bytecode (startup/server)
        run: cd startup/server && npm run build

      - name: Build app/server boot wrapper bytecode
        run: cd app/server && npm run build

      - name: Verify this runner matches the requested target
        # The whole point of a windows_x64 run is win32 bytecode. If the runner
        # is not what was asked for, everything below still succeeds and ships a
        # bundle that cannot boot on the target, so stop here instead.
        run: |
          HOST=$(node -p '(process.platform === "win32" ? "windows" : process.platform) + "_" + process.arch')
          echo "requested=$PLATFORM_ID runner=$HOST"
          [ "$HOST" = "$PLATFORM_ID" ] || {
            echo "runner is $HOST but this build is tagged $PLATFORM_ID — refusing to bundle." >&2
            exit 1
          }

      - name: Download shared runtime libs the server imports (nucleus + biometric gateway)
        # Built by gateway_build (gateway_builds.yml) with the SAME Node pin, so
        # the .jsc ABI matches the bytecode compiled above. Lands in the
        # source-relative layout the runtime aliases resolve to, which the
        # staging step below copies wholesale into the bundle.
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.gateway_build.outputs.artifact_name }}
          path: _gateway_artifact

      - name: Verify gateway bytecode matches this runner
        # gateway_build is a SEPARATE job on its own runner, so this is the one
        # place a linux-built .jsc could slip into a windows bundle. GATEWAY_VERSION
        # records what actually compiled it; the ABI must match ours exactly or the
        # gateways will not load beside the server bytecode built above.
        run: |
          . ./_gateway_artifact/GATEWAY_VERSION
          echo "gateway: $node_platform/$node_arch abi=$node_abi ($node_version)"
          OURS_PLATFORM=$(node -p process.platform)
          OURS_ARCH=$(node -p process.arch)
          OURS_ABI=$(node -p process.versions.modules)
          [ "$node_platform" = "$OURS_PLATFORM" ] && [ "$node_arch" = "$OURS_ARCH" ] && [ "$node_abi" = "$OURS_ABI" ] || {
            echo "gateway bytecode is $node_platform/$node_arch abi=$node_abi but this runner is $OURS_PLATFORM/$OURS_ARCH abi=$OURS_ABI." >&2
            echo "refusing to bundle mismatched bytecode." >&2
            exit 1
          }

      - name: Resolve version + bundle name
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # node, not jq: jq is a system binary we would otherwise have to
          # assume on every target runner, and node is already a hard build dep.
          STARTUP_VERSION=$(node -p "require('./package.json').version")
          CLIENT_VERSION=$(node -p "require('./app/client/package.json').version")
          SERVER_VERSION=$(node -p "require('./app/server/package.json').version")
          # On pull_request runs github.sha / git HEAD is the synthetic merge
          # commit, not the PR's actual head — prefer pull_request.head.sha so
          # the recorded commit matches the code that was actually built.
          COMMIT_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          COMMIT_MSG=$(gh api "repos/${{ github.repository }}/commits/$COMMIT_SHA" --jq '.commit.message' 2>/dev/null | head -n 1 || echo "")
          APP_NAME=$(basename "$GITHUB_REPOSITORY")
          BUNDLE_NAME="${APP_NAME}-site-v${STARTUP_VERSION}-${SHORT_SHA}-${PLATFORM_ID}"
          {
            echo "startup_version=$STARTUP_VERSION"
            echo "client_version=$CLIENT_VERSION"
            echo "server_version=$SERVER_VERSION"
            echo "short_sha=$SHORT_SHA"
            echo "full_sha=$COMMIT_SHA"
            echo "commit_msg=$COMMIT_MSG"
            echo "app_name=$APP_NAME"
            echo "bundle_name=$BUNDLE_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Download client build
        uses: actions/download-artifact@v8
        with:
          name: client-build-artifact
          path: _bundle/app/client

      - name: Download SalaryMitra portal build
        # Nest the portal inside the client tree so update.sh's existing
        # `cp -a app/client/. /app/<app>/` lands it at /app/<app>/salarymitra/
        # with no deploy-script changes. nginx serves it at /salarymitra/.
        uses: actions/download-artifact@v8
        with:
          name: ios-build-artifact
          path: _bundle/app/client/salarymitra

      - name: Stage server bytecode into bundle (mirrors install layout)
        run: |
          mkdir -p _bundle/startup/server _bundle/app/server
          cp -a startup/server/dist/. _bundle/startup/server/
          cp -a app/server/dist/.    _bundle/app/server/
          # Shared runtime libs the server imports at load time: build-gateways.sh
          # already compiled + laid these out under _gateway_artifact in the
          # source-relative form (nucleus/, biometric_gateway/…). Drop them in.
          cp -a _gateway_artifact/. _bundle/
          # @custom/server ships as plain JS (no bytecode config yet); exclude any
          # local node_modules/logs.
          cp -a custom _bundle/
          find _bundle/custom \( -name node_modules -o -name logs \) -prune -exec rm -rf {} +

      - name: Stage deploy files + entry scripts
        run: |
          mkdir -p _bundle/deploy _bundle/scripts
          cp deploy/README.md _bundle/deploy/
          # The updater is one cross-OS Node implementation; the two launchers
          # carry no logic, they just hand off to it from sh or cmd.
          cp deploy/update.js deploy/update.sh deploy/update.bat _bundle/
          # First-time provisioning is still Ubuntu-only (systemd units + nginx
          # site config). Shipping it into a Windows bundle would just be dead
          # weight the operator has to know to ignore, so gate it on the target.
          if [ "$PLATFORM_ID" = "linux_x64" ]; then
            cp deploy/base.conf deploy/base.service _bundle/deploy/
            cp deploy/0setup_ubuntu.sh deploy/1build_deploy_files.sh deploy/2link_files_to_internal_system.sh _bundle/deploy/
          fi
          # Docker deploy: the Dockerfile at the bundle root + its .dockerignore,
          # plus the install kit (compose + .env.example + install/start/backup
          # scripts + README). Together these make the site bundle directly
          # docker-deployable: `cd deploy/docker && docker compose up -d --build`
          # builds the root Dockerfile (env-only image, no COPY) and bind-mounts
          # the bundle at /srv/app. The image has no COPY, so the .dockerignore
          # keeps the on-target `docker compose build` from taring the whole
          # bundle (app/client, node_modules, docker_data …).
          if [ "$PLATFORM_ID" = "linux_x64" ]; then
            cp Dockerfile _bundle/
            printf '%s\n' 'node_modules' '**/node_modules' 'app/client' 'docker_data' 'deploy' 'scripts' '.env' '*.md' > _bundle/.dockerignore
            cp -r deploy/docker _bundle/deploy/docker
          fi
          # deploy/*.sh source scripts/download-artifact.sh, which in turn calls scripts/ask-app-name.js.
          cp scripts/download-artifact.sh scripts/ask-app-name.js _bundle/scripts/
          # Ship every tracked .gitignore. update.sh turns the bundle into a
          # one-commit git repo and resets the install dir to it; git's
          # `add -A` honors these gitignores so local-state files in the
          # install (.env, secret/credentials.json, node_modules/, generated
          # *.conf/*.service, etc.) stay untracked and are preserved across
          # the reset. Discovered dynamically — adding a new .gitignore in
          # any subdirectory tomorrow Just Works, no edits here.
          git ls-files -z -- '.gitignore' '**/.gitignore' | while IFS= read -r -d '' gi; do
            mkdir -p "_bundle/$(dirname "$gi")"
            cp "$gi" "_bundle/$gi"
          done
          # No-op on a Windows runner (NTFS has no exec bit) and harmless there.
          chmod +x _bundle/update.js _bundle/update.sh _bundle/scripts/download-artifact.sh
          chmod +x _bundle/deploy/*.sh 2>/dev/null || true

      - name: Write VERSION metadata
        run: |
          cat > _bundle/VERSION <<EOF
          startup_version=${{ steps.meta.outputs.startup_version }}
          client_version=${{ steps.meta.outputs.client_version }}
          server_version=${{ steps.meta.outputs.server_version }}
          commit=${{ steps.meta.outputs.full_sha }}
          short_sha=${{ steps.meta.outputs.short_sha }}
          app_name=${{ steps.meta.outputs.app_name }}
          built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          node_version=$(node -v)
          node_arch=$(node -p process.arch)
          node_platform=$(node -p process.platform)
          node_abi=$(node -p process.versions.modules)
          v8_version=$(node -p process.versions.v8)
          commit_msg=${{ steps.meta.outputs.commit_msg }}
          EOF

      - name: Upload site deployment artifact
        # Upload _bundle/ contents directly (no pre-zip). GitHub wraps the
        # upload into a single zip named `<artifact-name>.zip` at download
        # time, so setting `name` to the versioned bundle name gives you
        # `<repo>-site-vX.Y.Z-sha-<platform>.zip` straight from the download —
        # no outer `site-deployment-artifact.zip` wrapper to unzip first.
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.bundle_name }}
          path: _bundle/
          include-hidden-files: true

  # ────────────────────────────────────────────────────────────────────
  # SOURCE TESTS (source-mode) — defined in source_tests.yml.
  # Starts as soon as client_build is green, in parallel with the
  # server_build job. Tests run against
  # `node app/server/index.js` + `vite dev` using the checked-out source
  # (no build artifacts consumed).
  # ────────────────────────────────────────────────────────────────────
  source_tests:
    needs: client_build
    # contents: write is needed by the reusable workflow to attach
    # source-e2e-results to the GitHub release on release events.
    permissions:
      contents: write
    uses: ./.github/workflows/source_tests.yml

  # ────────────────────────────────────────────────────────────────────
  # LINUX BUILT TESTS (built/deployed-mode) — defined in linux_built_tests.yml.
  # Runs once server_build has produced the deployment bundle
  # AND source_tests has finished (the two test jobs share fixed docker
  # resource names — pg/test-net/deploy + host ports — so they cannot
  # overlap on the same runner).
  # ────────────────────────────────────────────────────────────────────
  linux_built_tests:
    needs: [setup, server_build, source_tests]
    # Deploys the bundle with the Ubuntu deploy scripts in a systemd container,
    # so it only applies to a linux target.
    if: needs.setup.outputs.platform == 'linux_x64'
    uses: ./.github/workflows/linux_built_tests.yml
    with:
      bundle_name: ${{ needs.server_build.outputs.bundle_name }}
