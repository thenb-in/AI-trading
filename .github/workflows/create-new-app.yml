name: Create new app → push to fresh repo

# Manual, one-shot bootstrap: takes an empty GitHub repo, runs
# `npm run create-new-app <repo-url>` against a clean checkout of this
# template (random ports, renamed package.json, remotes repointed), then
# pushes the result to that repo using `secrets.STARTUP_SYNC_TOKEN`.
#
# The target repo is expected to be EMPTY. Pushing onto a repo that already
# has commits fails on non-ff unless `force` is checked — that guard is
# deliberate, since this workflow overwrites whatever is there.

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Fresh repo to push to: owner/repo, or its https:// / git@ URL.'
        required: true
        type: string
      app_name:
        description: 'App name for package.json / deploy paths. Defaults to the target repo name.'
        required: false
        type: string
      branch:
        description: 'Branch to create on the target repo.'
        required: false
        type: string
        default: main
      squash_history:
        description: 'Push a single initial commit instead of the full template history.'
        required: false
        type: boolean
        default: false
      force:
        description: 'Force-push. Needed only if the target repo already has commits — this OVERWRITES them.'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Do everything except the push.'
        required: false
        type: boolean
        default: false

# One bootstrap at a time; two concurrent runs would race on the same target.
concurrency:
  group: create-new-app-${{ inputs.target_repo }}
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # only reads this repo; the target push uses STARTUP_SYNC_TOKEN

    steps:
      - name: Check token is configured
        env:
          TOKEN: ${{ secrets.STARTUP_SYNC_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN}" ]; then
            echo "::error::secrets.STARTUP_SYNC_TOKEN is not set on this repo."
            exit 1
          fi

      # Inputs are never interpolated straight into shell — they arrive as env
      # vars so a crafted repo name can't inject commands.
      - name: Normalize target repo
        id: target
        env:
          RAW: ${{ inputs.target_repo }}
          RAW_APP_NAME: ${{ inputs.app_name }}
          RAW_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail
          SLUG="${RAW}"
          SLUG="${SLUG%.git}"
          SLUG="${SLUG#git@github.com:}"
          SLUG="${SLUG#https://github.com/}"
          SLUG="${SLUG#http://github.com/}"
          SLUG="${SLUG#github.com/}"
          SLUG="${SLUG#/}"
          SLUG="${SLUG%/}"
          if [[ ! "${SLUG}" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Could not parse '${RAW}' as owner/repo."
            exit 1
          fi

          REPO_NAME="${SLUG#*/}"
          APP_NAME="${RAW_APP_NAME:-${REPO_NAME}}"
          BRANCH="${RAW_BRANCH:-main}"
          if [[ ! "${BRANCH}" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::Invalid branch name '${BRANCH}'."
            exit 1
          fi

          {
            echo "slug=${SLUG}"
            echo "url=https://github.com/${SLUG}.git"
            echo "app_name=${APP_NAME}"
            echo "branch=${BRANCH}"
          } >> "$GITHUB_OUTPUT"

          echo "[target] repo=${SLUG} app=${APP_NAME} branch=${BRANCH}"

      # Fail before spending a checkout + npm install on a target we can't push
      # to. GitHub answers 404 (not 403) for private repos a token can't see, so
      # "not found" is ambiguous by design — spell out both readings here rather
      # than letting `git push` report it as a bare "Repository not found".
      - name: Preflight target repo
        env:
          TOKEN: ${{ secrets.STARTUP_SYNC_TOKEN }}
          SLUG: ${{ steps.target.outputs.slug }}
          BRANCH: ${{ steps.target.outputs.branch }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          STATUS=$(curl -sS -o /tmp/repo.json -w '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${SLUG}")

          case "${STATUS}" in
            200) ;;
            401)
              echo "::error::STARTUP_SYNC_TOKEN was rejected (401). It is invalid, revoked, or expired."
              exit 1
              ;;
            403)
              echo "::error::STARTUP_SYNC_TOKEN is forbidden from ${SLUG} (403). If the org enforces SAML SSO, authorize the token for '${SLUG%/*}'."
              exit 1
              ;;
            404)
              echo "::error::${SLUG} is not visible to STARTUP_SYNC_TOKEN (404). GitHub returns 404 for private repos a token cannot see, so this is either: (a) the repo does not exist, or (b) the token has no access to it. Check that the repo exists, and that the token grants Contents: Read and write on ${SLUG} — a fine-grained PAT scoped to 'Only select repositories' must list this repo explicitly."
              exit 1
              ;;
            *)
              echo "::error::Unexpected ${STATUS} from the GitHub API for ${SLUG}."
              cat /tmp/repo.json
              exit 1
              ;;
          esac

          if [ "$(jq -r '.permissions.push // false' /tmp/repo.json)" != "true" ]; then
            echo "::error::STARTUP_SYNC_TOKEN can read ${SLUG} but cannot push to it. Grant Contents: Read and write."
            exit 1
          fi

          # Branch check goes through the push URL, not `origin` — at this point
          # origin is still the template repo, which always has the branch.
          if [ "${FORCE}" != "true" ] \
            && git ls-remote --exit-code --heads "https://x-access-token:${TOKEN}@github.com/${SLUG}.git" "${BRANCH}" >/dev/null 2>&1; then
            echo "::error::${SLUG} already has a '${BRANCH}' branch. Re-run with force=true to OVERWRITE it."
            exit 1
          fi

          echo "[preflight] ${SLUG} is writable and has no '${BRANCH}' branch"

      - name: Checkout template
        uses: actions/checkout@v5
        with:
          # Full history so the generated app inherits the template's history
          # (unless squash_history is set, which starts an orphan branch).
          fetch-depth: 0
          # REQUIRED. Left at the default (true), checkout stores
          #   http.https://github.com/.extraheader = AUTHORIZATION: basic <GITHUB_TOKEN>
          # in .git/config, and git sends it on every github.com request from
          # this clone. An explicit Authorization header OVERRIDES the
          # `x-access-token:<token>@` credentials in a push URL, so the push
          # below would authenticate as GITHUB_TOKEN — which is scoped to this
          # repo only and cannot see the target — and fail with a misleading
          # "Repository not found". Nothing here re-fetches after checkout, so
          # dropping the stored credential costs nothing.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Run create-new-app
        env:
          TARGET_URL: ${{ steps.target.outputs.url }}
          APP_NAME: ${{ steps.target.outputs.app_name }}
        run: |
          set -euo pipefail
          # create-app.js prompts for the app name on stdin (readline). Typing
          # a name directly is accepted at that prompt regardless of which
          # folder/GitHub options it offers, so we always feed the resolved
          # name rather than a menu number.
          printf '%s\n' "${APP_NAME}" | npm run create-new-app -- "${TARGET_URL}"

      - name: Commit generated app
        id: commit
        env:
          SQUASH: ${{ inputs.squash_history }}
          BRANCH: ${{ steps.target.outputs.branch }}
          APP_NAME: ${{ steps.target.outputs.app_name }}
        run: |
          set -euo pipefail
          git config user.name  'startup-sync-bot'
          git config user.email 'startup-sync-bot@users.noreply.github.com'

          if [ "${SQUASH}" = "true" ]; then
            # Orphan branch = no template history, one initial commit.
            git checkout --orphan "${BRANCH}"
            git add -A
            git commit -m "chore: bootstrap ${APP_NAME} from startup template"
          else
            git checkout -B "${BRANCH}"
            git add -A
            if git diff --cached --quiet; then
              echo "[commit] create-new-app produced no changes; pushing history as-is"
            else
              git commit -m "chore: configure ${APP_NAME} from startup template"
            fi
          fi

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git --no-pager log --oneline -1

      - name: Push to target repo
        if: ${{ inputs.dry_run != true }}
        env:
          # Push URL only — `origin`'s fetch URL stays token-free so the token
          # never lands in the pushed .git/config.
          TOKEN: ${{ secrets.STARTUP_SYNC_TOKEN }}
          SLUG: ${{ steps.target.outputs.slug }}
          BRANCH: ${{ steps.target.outputs.branch }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail

          # Belt and braces for the persist-credentials:false above — if a
          # stored extraheader ever comes back, it silently outranks the push
          # URL's credentials and the push fails as a bogus 404. Drop it.
          if git config --local --name-only --get-regexp '^http\..*\.extraheader$' >/dev/null 2>&1; then
            echo "[push] clearing checkout-persisted credentials so the push URL's token is used"
            git config --local --unset-all 'http.https://github.com/.extraheader' || true
          fi

          git remote set-url --push origin "https://x-access-token:${TOKEN}@github.com/${SLUG}.git"

          PUSH_ARGS=( origin "HEAD:refs/heads/${BRANCH}" )
          if [ "${FORCE}" = "true" ]; then
            PUSH_ARGS+=( --force )
          fi

          # Retry transient network failures only. Auth/visibility and non-ff
          # rejections are permanent — retrying them just buries the real cause
          # under a backoff ladder, so they exit on the first attempt.
          ATTEMPT=1
          DELAY=2
          while :; do
            if OUT=$(git push "${PUSH_ARGS[@]}" 2>&1); then
              echo "${OUT}"
              break
            fi
            echo "${OUT}"

            case "${OUT}" in
              *"Repository not found"*|*"Invalid username or password"*|*"Authentication failed"*|*"Permission to"*|*"403"*)
                echo "::error::Push to ${SLUG} was rejected for access reasons. STARTUP_SYNC_TOKEN needs Contents: Read and write on ${SLUG} (GitHub reports a private repo it cannot see as 'Repository not found')."
                exit 1
                ;;
              *"non-fast-forward"*|*"fetch first"*|*"[rejected]"*)
                echo "::error::${SLUG} already has commits on '${BRANCH}'. Re-run with force=true to OVERWRITE them."
                exit 1
                ;;
            esac

            if [ "${ATTEMPT}" -ge 5 ]; then
              echo "[push] giving up after ${ATTEMPT} attempts"
              exit 1
            fi
            echo "[push] attempt ${ATTEMPT} failed; retrying in ${DELAY}s"
            sleep "${DELAY}"
            ATTEMPT=$((ATTEMPT + 1))
            DELAY=$((DELAY * 2))
          done

      - name: Summarize on the run page
        if: always()
        env:
          SLUG: ${{ steps.target.outputs.slug }}
          BRANCH: ${{ steps.target.outputs.branch }}
          APP_NAME: ${{ steps.target.outputs.app_name }}
          SHA: ${{ steps.commit.outputs.sha }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo "## Create new app"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Target repo | \`${SLUG}\` |"
            echo "| Branch | \`${BRANCH}\` |"
            echo "| App name | \`${APP_NAME}\` |"
            echo "| Commit | \`${SHA:-(none)}\` |"
            echo "| Dry run | ${DRY_RUN:-false} |"
            echo ""
            if [ "${DRY_RUN}" = "true" ]; then
              echo "_Dry run — nothing was pushed._"
            else
              echo "https://github.com/${SLUG}/tree/${BRANCH}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
