name: Lint Check

on:
  push:
    branches:
      - main
      - master
      - test-ci
  pull_request:
    branches:
      - main
      - master

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm run i
        env:
          CI: true
          HUSKY: 0

      - name: Run lint check for server
        run: npm run lint:server
        env:
          CI: true

      - name: Run lint check for client
        run: npm run lint:client
        env:
          CI: true

      - name: Check code duplication (jscpd)
        run: npm run check-duplicates
        env:
          CI: true
