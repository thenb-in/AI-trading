name: Smoke test server startup

on:
  push:
    branches:
      - main
      - master
      - test-ci
    paths:
      - 'startup/server/**'  # Only trigger if files in the server directory change

  pull_request:
    branches:
      - main
      - master

  release:
    types: [published]
  

jobs:
  server_dev_run:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      actions: write
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies and setup environment
        run: npm run i
        env:
          CI: true
          HUSKY: 0
          # Database configuration for CI environment
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: test_db
          DB_USER: postgres
          DB_PASSWORD: postgres

      - name: Verify .env file was created
        run: |
          cd startup/server
          if [ ! -f .env ]; then
            echo "❌ Error: .env file was not created by setup script"
            exit 1
          else
            echo "✅ .env file created successfully"
          fi

      - name: Run server in dev mode
        run: |
          cd startup/server
          npm run dev &
          DEV_PID=$!
          sleep 15

          if ! kill -0 $DEV_PID 2>/dev/null; then
            echo "❌ Server failed to start."
            exit 1
          fi

          echo "✅ Server started successfully, no startup errors."
          kill $DEV_PID
        env:
          CI: true

      - name: Create new company
        run: |
          cd startup/server
          echo "this command needs to be setup: \`npm run create-new-company\`"
        env:
          CI: true