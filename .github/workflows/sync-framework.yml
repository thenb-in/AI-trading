name: Sync thenb-in/startup → this app

# Nightly PULL of framework changes from `thenb-in/startup` into this app
# repo, per the rules in `scripts/sync-framework.js`. The mirror of
# sync-startup.yml, which pushes this app's framework work the other way.
#
# It is a pull, run by the repo that receives the commits, so every write is
# local: the run needs only READ access to the framework repo and no
# cross-repo write token.
#
# State is the sync branch itself. Each replayed commit carries a
# `Synced-from-startup: <sha>` trailer, and the newest such trailer reachable
# from the branch IS the resume point — so there is no state tag that can
# drift out of step with what this repo actually contains. The branch is
# long-lived on purpose: if its PR sits open for a week, each night appends to
# it rather than cutting a fresh branch off main that lacks the previous
# nights' commits (which is what makes one conflict cascade into many), and
# any conflict resolved by hand in the PR stays resolved.
#
# IMPORTANT: merge these PRs with a MERGE COMMIT, never a squash. A squash
# collapses the per-commit history this whole design exists to preserve, and
# eats the trailers the resume point is read from — so the next run would
# replay everything again.

on:
  schedule:
    # 19:30 UTC = ~01:00 IST, an hour after sync-startup.yml, so the outbound
    # batch has landed before we pull back.
    - cron: '30 19 * * *'

  workflow_dispatch:
    inputs:
      start_from_sha:
        description: >
          Override the starting source SHA. Normally unnecessary — the resume
          point is read from the sync branch's own commit trailers.
        required: false
        type: string
      dry_run:
        description: 'Run the sync but do NOT push the branch or open a PR.'
        required: false
        type: boolean
        default: false

concurrency:
  group: sync-framework
  cancel-in-progress: false

jobs:
  sync:
    # This workflow lives under `.github/`, which is a framework path, so the
    # framework repo carries a copy of it too. Without this guard it would run
    # there with itself as both source and target. The script guards this as
    # well (and exits 0); this just avoids burning a runner nightly.
    if: github.repository != 'thenb-in/startup'
    runs-on: ubuntu-latest
    permissions:
      # GITHUB_TOKEN stays read-only. Every write — the branch push, the PR,
      # labels — uses a short-lived Octo STS token instead. That matches how
      # sync-startup.yml already works, and it has a second benefit: GitHub's
      # recursion guard suppresses workflow runs for anything GITHUB_TOKEN
      # does, so a PR opened with it would never get its checks run. An app
      # installation token triggers them normally.
      contents: read
      id-token: write        # federate the Octo STS tokens below

    env:
      SOURCE_REPO: thenb-in/startup
      SOURCE_BRANCH: main
      TARGET_BASE_BRANCH: main
      SYNC_BRANCH: sync/from-startup

    steps:
      - name: Mint a write token for THIS repo (Octo STS)
        uses: octo-sts/action@main
        id: octo-sts-self
        with:
          scope: ${{ github.repository }}
          identity: app-token
        # Resolves against this repo's own
        # .github/chainguard/app-token.sts.yaml — which is itself a synced
        # framework file, so every app repo has it.

      - name: Checkout this app repo (the sync target)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # need full history to read provenance trailers
          token: ${{ steps.octo-sts-self.outputs.token }}  # so the push below is authorised

      - name: Mint a read token for the framework repo (Octo STS)
        uses: octo-sts/action@main
        id: octo-sts-source
        with:
          scope: thenb-in/startup
          identity: app-token
        # Federates this run's OIDC identity against the trust policy at
        # thenb-in/startup/.github/chainguard/app-token.sts.yaml. This
        # direction only needs contents:read on the framework; the shared
        # identity is wider than that, which a dedicated read-only identity
        # would tighten.

      - name: Checkout the framework repo (the sync source)
        uses: actions/checkout@v5
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_BRANCH }}
          path: source-startup
          fetch-depth: 0
          token: ${{ steps.octo-sts-source.outputs.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install sync-script dependencies
        # Installed OUTSIDE the workspace on purpose: the workspace is the
        # sync target, and installing into it would dirty the tree the script
        # is about to branch and commit.
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/syncdeps"
          cd "${RUNNER_TEMP}/syncdeps"
          npm init -y > /dev/null
          npm install --no-audit --no-fund --ignore-scripts cli-table3

      - name: Run sync
        id: sync
        env:
          NODE_PATH: ${{ runner.temp }}/syncdeps/node_modules
          INPUT_START: ${{ inputs.start_from_sha }}
        run: |
          set -euo pipefail
          ARGS=(
            --source-repo="${GITHUB_WORKSPACE}/source-startup"
            --target-repo="${GITHUB_WORKSPACE}"
            --source-branch="${SOURCE_BRANCH}"
            --target-base-branch="${TARGET_BASE_BRANCH}"
            --target-branch="${SYNC_BRANCH}"
            --log-dir="${RUNNER_TEMP}/sync-logs"
          )
          if [ -n "${INPUT_START}" ]; then
            ARGS+=( --start-from="${INPUT_START}" )
          fi
          node scripts/sync-framework.js "${ARGS[@]}"

      - name: Upload sync logs (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sync-framework-logs-${{ github.run_number }}.${{ github.run_attempt }}
          path: ${{ runner.temp }}/sync-logs/
          if-no-files-found: warn
          retention-days: 30

      - name: Push sync branch
        id: push
        if: >-
          success() &&
          inputs.dry_run != true &&
          steps.sync.outputs.skipped_same_repo != 'true' &&
          (steps.sync.outputs.has_changes == 'true' || steps.sync.outputs.has_conflicts == 'true')
        run: |
          set -euo pipefail
          ATTEMPT=1; DELAY=2
          until git push -u origin "${SYNC_BRANCH}"; do
            if [ "${ATTEMPT}" -ge 5 ]; then
              echo "[push] giving up after ${ATTEMPT} attempts"
              exit 1
            fi
            echo "[push] attempt ${ATTEMPT} failed; retrying in ${DELAY}s"
            sleep "${DELAY}"; ATTEMPT=$((ATTEMPT + 1)); DELAY=$((DELAY * 2))
          done
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Open or update the PR
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ steps.octo-sts-self.outputs.token }}
          CONFLICTS: ${{ steps.sync.outputs.conflicts }}
          APPLIED: ${{ steps.sync.outputs.commits_applied }}
          SKIPPED: ${{ steps.sync.outputs.commits_skipped }}
          EXAMINED: ${{ steps.sync.outputs.commits_examined }}
          FROM_SHA: ${{ steps.sync.outputs.from_sha }}
          TO_SHA: ${{ steps.sync.outputs.to_sha }}
          FROM_DATE: ${{ steps.sync.outputs.from_date }}
          TO_DATE: ${{ steps.sync.outputs.to_date }}
          PENDING: ${{ steps.sync.outputs.pending_commits }}
          BASE_MERGE_CONFLICT: ${{ steps.sync.outputs.base_merge_conflict }}
        run: |
          set -euo pipefail

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          GUIDE_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${SYNC_BRANCH}/scripts/lib/sync/README.md"
          {
            echo "> [!NOTE]"
            echo "> **New to these PRs? Read [Reviewing a sync PR](${GUIDE_URL}) before you review or merge.**"
            echo "> It covers the merge-commit rule, how to resolve a conflict, and what crosses between repos."
            echo ""
            echo "Automated sync from \`${SOURCE_REPO}\` → \`${GITHUB_REPOSITORY}\`."
            echo ""
            echo "**Source range:** \`${FROM_SHA:-(bootstrap)}\`..\`${TO_SHA}\` (${FROM_DATE:-?} → ${TO_DATE})"
            echo "**Commits pending on this branch:** ${PENDING}"
            echo "**Commits applied:** ${APPLIED}"
            echo "**Commits skipped:** ${SKIPPED}"
            echo "**Commits examined:** ${EXAMINED}"
            echo "**Unresolved conflicts:** ${CONFLICTS}"
            echo ""
            if [ "${CONFLICTS}" != "0" ]; then
              echo "> [!IMPORTANT]"
              echo "> ${CONFLICTS} file(s) could not be merged automatically and are parked under"
              echo "> \`sync-conflicts/\`. Each holds a three-way merge of what this repo had, the"
              echo "> common ancestor, and the incoming version. **The real file currently holds the"
              echo "> framework version**, so the branch still builds and the tests still mean"
              echo "> something — but this repo's own edits to those files are in the \`.conflict\`"
              echo "> files, not in the tree."
              echo ">"
              echo "> Resolve each: edit the real file, delete its \`.conflict\` file. The"
              echo "> \`sync-conflicts\` check stays red until \`sync-conflicts/\` is empty."
              echo ""
            fi
            if [ "${BASE_MERGE_CONFLICT}" = "true" ]; then
              echo "> [!WARNING]"
              echo "> \`${TARGET_BASE_BRANCH}\` could not be merged into this branch cleanly."
              echo "> Resolve the branch conflict before merging."
              echo ""
            fi
            echo "> [!CAUTION]"
            echo "> **Merge this with a merge commit, not a squash.** A squash destroys the"
            echo "> per-commit history and eats the \`Synced-from-startup\` trailers the next"
            echo "> run reads its resume point from."
            echo ""
            echo "Full per-commit log is attached to the workflow run: ${RUN_URL}"
            echo ""
            echo "---"
            echo ""
            echo "Rules applied (from \`scripts/sync-framework.js\`):"
            echo "- Framework paths (\`startup/\`, \`nucleus/\`, \`report_runner/\`, \`lints/\`, \`deploy/\`, \`.github/\`, \`.vscode/\`, \`.husky/\`) always cross, and anchor the commit."
            echo "- \`db-scripts/startup/\` rides along on a commit that also touches a framework path."
            echo "- Other paths cross **only if this repo already has the file**."
            echo "- Commits that originated in this repo are skipped, so nothing round-trips."
            echo "- Divergent files are three-way merged; only genuinely overlapping edits are parked as conflicts."
            echo ""
            echo "Full rules, review steps and conflict-resolution instructions: [scripts/lib/sync/README.md](${GUIDE_URL})"
          } > "${RUNNER_TEMP}/pr-body.md"

          # Source repo first, matching sync-startup.yml, so both directions
          # read the same way wherever you see them.
          # See sync-startup.yml: the date says how current this brings the
          # repo, the count is everything pending on the standing branch.
          TITLE="sync: $(basename "${SOURCE_REPO}") → $(basename "${GITHUB_REPOSITORY}")"
          if [ -n "${TO_DATE}" ]; then
            [ "${PENDING}" = "1" ] && NOUN=commit || NOUN=commits
            TITLE="${TITLE} (${PENDING} ${NOUN}, through ${TO_DATE})"
          fi

          EXISTING=$(gh pr list --head "${SYNC_BRANCH}" --state open --json number --jq '.[0].number // empty')
          if [ -z "${EXISTING}" ]; then
            gh pr create \
              --base "${TARGET_BASE_BRANCH}" \
              --head "${SYNC_BRANCH}" \
              --title "${TITLE}" \
              --body-file "${RUNNER_TEMP}/pr-body.md"
            # Source repo first, matching sync-startup.yml, so both directions
          # read the same way wherever you see them.
          # See sync-startup.yml: the date says how current this brings the
          # repo, the count is everything pending on the standing branch.
          TITLE="sync: $(basename "${SOURCE_REPO}") → $(basename "${GITHUB_REPOSITORY}")"
          if [ -n "${TO_DATE}" ]; then
            [ "${PENDING}" = "1" ] && NOUN=commit || NOUN=commits
            TITLE="${TITLE} (${PENDING} ${NOUN}, through ${TO_DATE})"
          fi

          EXISTING=$(gh pr list --head "${SYNC_BRANCH}" --state open --json number --jq '.[0].number // empty')
          else
            # Standing branch: the PR already exists, so refresh its body and
            # leave a note rather than opening a second one.
            gh pr edit "${EXISTING}" --title "${TITLE}" --body-file "${RUNNER_TEMP}/pr-body.md"
            gh pr comment "${EXISTING}" --body "Nightly sync appended ${APPLIED} commit(s). Unresolved conflicts: ${CONFLICTS}. [Run log](${RUN_URL})"
          fi

          if [ "${CONFLICTS}" != "0" ]; then
            gh label create sync-conflict --color B60205 \
              --description "Sync PR with unresolved conflicts needing manual reconciliation" \
              --force > /dev/null 2>&1 || true
            gh pr edit "${EXISTING}" --add-label sync-conflict || true
          else
            gh pr edit "${EXISTING}" --remove-label sync-conflict > /dev/null 2>&1 || true
          fi

      - name: Re-ping stale conflict PRs
        # The realistic failure is not that nobody saw the conflict on night
        # one — it is that the PR quietly rots. Every night this re-states the
        # age of any still-open conflicted sync PR on the PR itself.
        if: always() && steps.sync.outputs.skipped_same_repo != 'true'
        env:
          GH_TOKEN: ${{ steps.octo-sts-self.outputs.token }}
          STALE_AFTER_DAYS: '3'
        run: |
          set -euo pipefail
          gh pr list --state open --label sync-conflict \
            --json number,createdAt,title --jq '.[] | @base64' | while read -r row; do
            [ -z "${row}" ] && continue
            NUM=$(echo "${row}" | base64 -d | jq -r .number)
            CREATED=$(echo "${row}" | base64 -d | jq -r .createdAt)
            AGE=$(( ( $(date -u +%s) - $(date -u -d "${CREATED}" +%s) ) / 86400 ))
            if [ "${AGE}" -ge "${STALE_AFTER_DAYS}" ]; then
              gh pr comment "${NUM}" --body "⏳ This sync PR has had unresolved conflicts for ${AGE} day(s). Framework changes are not reaching this app until it is reconciled and merged."
            fi
          done

      - name: Open / close the sync-failure issue
        # A nightly job that fails is invisible: nobody watches the Actions
        # tab. Surface it where work is actually triaged, and reuse one issue
        # per direction rather than filing a fresh one every night. On the
        # next green run the same issue is closed, so an open one always means
        # "the sync is broken right now".
        if: always() && steps.octo-sts-self.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.octo-sts-self.outputs.token }}
          FAILED: ${{ (job.status == 'failure' || steps.sync.outcome == 'failure') && 'true' || 'false' }}
          ISSUE_TITLE: 'Nightly sync is failing: ${{ env.SOURCE_REPO }} → ${{ github.repository }}'
        run: |
          set -euo pipefail
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh label create sync-failure --color B60205 \
            --description "The nightly repo sync is failing and needs manual attention" \
            --force > /dev/null 2>&1 || true

          EXISTING=$(gh issue list --state open --label sync-failure \
            --search "${ISSUE_TITLE} in:title" \
            --json number,title --jq "map(select(.title == \"${ISSUE_TITLE}\")) | .[0].number // empty")

          if [ "${FAILED}" = "true" ]; then
            BODY=$(printf '%s\n' \
              "The nightly sync run failed, so commits are **not** crossing between these repos." \
              "" \
              "- **Run:** ${RUN_URL}" \
              "- **Direction:** ${{ env.SOURCE_REPO }} → ${{ github.repository }}" \
              "" \
              "Until this is fixed the two repos drift apart. The full per-commit log is attached" \
              "to the run as an artifact; it records exactly which commit it stopped on." \
              "" \
              "Re-running is safe — the resume point is read from the sync branch, so nothing is" \
              "replayed twice and nothing needs unpicking by hand. If it names a commit the source" \
              "cannot resolve, re-run the workflow manually with \`start_from_sha\` set." \
              "" \
              "See \`scripts/lib/sync/README.md\` for what the sync does and how to drive it.")
            if [ -z "${EXISTING}" ]; then
              gh issue create --title "${ISSUE_TITLE}" --label sync-failure --body "${BODY}"
            else
              gh issue comment "${EXISTING}" --body "Still failing as of $(date -u +%Y-%m-%d). Run: ${RUN_URL}"
            fi
          elif [ -n "${EXISTING}" ]; then
            gh issue comment "${EXISTING}" --body "Recovered — the sync ran clean. Run: ${RUN_URL}"
            gh issue close "${EXISTING}"
          fi

      - name: Summarize on the run page
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/sync-logs/sync-log.md" ]; then
            {
              echo "## Framework sync"
              echo ""
              echo "**Branch:** \`${SYNC_BRANCH}\`"
              echo ""
              awk '/## Run summary/,/## Per-commit detail/' "${RUNNER_TEMP}/sync-logs/sync-log.md" | sed '$d'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
