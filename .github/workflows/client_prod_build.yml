name: Build and Upload Artifact

on:
  push:
    branches:
      - main
      - master
      - test-ci
    # paths:
    #   - 'client/**'  # Only trigger if files in the client directory change

  pull_request:
    branches:
      - main
      - master

  release:
    types: [published]


jobs:
  client_prod_build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      actions: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22  # Change if needed

      - name: Set environment variables
        run: |
          cp app/client/.env.example app/client/.env

      - name: Install framework deps (startup/client)
        run: |
          cd startup/client
          npm install

      - name: Install app deps (app/client)
        run: |
          cd app/client
          npm install

      - name: Run build
        run: |
          cd app/client
          npm run build

      - name: Remove old artifacts
        uses: c-hive/gha-remove-artifacts@v1
        with:
            age: '2 days'
            skip-recent: 2

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: app/client/dist/
