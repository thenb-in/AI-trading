name: Linux Built Tests

# Reusable workflow — called from builds.yml after site_bundle_linux_x64 +
# source_tests are green. Downloads the Linux bundle artifact, deploys it
# inside a privileged systemd-enabled container (running the actual deploy
# scripts), then runs the same three test phases against the deployed system
# over nginx + the bytecoded backend.
on:
  workflow_call:
    inputs:
      bundle_name:
        description: 'Name of the deployment-bundle artifact produced by site_bundle_linux_x64.'
        required: true
        type: string

jobs:
  linux_built_tests:
    runs-on: [self-hosted, Linux, X64]

    # Serialize with source_tests on the same group so the two jobs don't
    # race on the fixed docker names ($PG_CONTAINER / $TEST_NETWORK /
    # $DEPLOY_CONTAINER). Without this, a teardown from an earlier-started
    # run can `docker rm -f` the container a freshly-started run just
    # brought up — manifests as "Error response from daemon: container ...
    # is not running" mid-step.
    concurrency:
      group: ci-self-hosted-linux-tests
      cancel-in-progress: false

    env:
      TEST_APP_NAME: nbnext-ci
      PG_CONTAINER: test-pg
      DEPLOY_CONTAINER: test-deploy
      TEST_NETWORK: test-net
      BUILT_HOST_PORT: '8080'

    defaults:
      run:
        shell: bash

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        # Tests run from the source workspace (we need tests/, package.json,
        # node_modules cache). The deployed system being tested lives inside
        # the deploy container. Checkout must come first — composite actions
        # in .github/actions/ can only be loaded after the repo is checked out.
        uses: actions/checkout@v5

      - name: Install dependencies (node + playwright + .env)
        uses: ./.github/actions/install-deps

      - name: Download deployment bundle
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.bundle_name }}
          path: _install/

      - name: Bring up Postgres + APP_URL
        uses: ./.github/actions/postgres-up
        with:
          built_mode: 'true'

      - name: Pre-pull deploy image (self-hosted only)
        # On self-hosted runners the docker daemon persists across jobs, so
        # making the pull explicit here turns it into a one-time cost: first
        # job pulls, every subsequent job sees the image cached and skips it.
        # On github-hosted runners the daemon is fresh per job — the pull
        # would happen regardless, so there's nothing to gain from doing it
        # in a separate step.
        if: runner.environment != 'github-hosted'
        run: |
          if docker image inspect jrei/systemd-ubuntu:22.04 >/dev/null 2>&1; then
            echo "[pre-pull] jrei/systemd-ubuntu:22.04 already cached locally — skipping pull"
          else
            echo "[pre-pull] jrei/systemd-ubuntu:22.04 not cached — pulling now"
            docker pull jrei/systemd-ubuntu:22.04
          fi

      - name: Start systemd-enabled deploy container
        # Privileged + cgroup mounts let systemd run as PID 1 inside.
        # We do NOT bind-mount _install/ here. Reason: when the runner is
        # itself a container (DooD), bind paths are resolved by the HOST
        # docker daemon, which can't see the runner's filesystem. The bundle
        # is copied in via `docker cp` in the next step instead — that goes
        # through the runner's view of files, so it works in both DooD and
        # bare-metal runner setups.
        run: |
          docker run -d --privileged \
            --name "$DEPLOY_CONTAINER" \
            --network "$TEST_NETWORK" \
            --cgroupns=host \
            --tmpfs /tmp --tmpfs /run --tmpfs /run/lock \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -p ${BUILT_HOST_PORT}:80 \
            jrei/systemd-ubuntu:22.04
          # Wait until systemd is up enough to accept systemctl calls.
          for i in $(seq 1 30); do
            if docker exec "$DEPLOY_CONTAINER" systemctl is-system-running --wait 2>/dev/null | grep -qE 'running|degraded'; then
              echo "systemd ready"; exit 0
            fi
            sleep 1
          done
          echo "systemd never became ready inside container"
          docker exec "$DEPLOY_CONTAINER" systemctl --no-pager || true
          exit 1

      - name: Copy bundle into the deploy container
        # docker cp reads from the runner's filesystem (which the runner
        # can see) and writes into the container. Avoids the DooD bind-mount
        # trap where -v <runner_path> resolves on the HOST docker daemon to
        # an empty path it doesn't recognize.
        run: |
          docker exec "$DEPLOY_CONTAINER" mkdir -p /install
          docker cp _install/. "$DEPLOY_CONTAINER:/install/"
          # Sanity check — verify the deploy scripts landed where expected.
          docker exec "$DEPLOY_CONTAINER" ls /install/deploy/1build_deploy_files.sh

      - name: Run deploy scripts inside container
        # This is what the human-runbook does on a fresh prod server. If any
        # of the deploy scripts is broken, this step fails — linux_built_tests
        # doubles as the deploy-script regression check.
        run: |
          docker exec -i \
            -e APP_NAME="$TEST_APP_NAME" \
            -e IP_ADDRESS="$DEPLOY_CONTAINER" \
            -e SYSTEM_USER=root \
            -e PG_HOST="$PG_CONTAINER" \
            -e DB_NAME="$DB_NAME" \
            "$DEPLOY_CONTAINER" bash <<'INNER_EOF'
          set -euo pipefail

          # Runtime deps: nginx + node 22 + curl/jq/git/sudo/unzip.
          # NodeSource for node 22 — the apt nodejs is older.
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq curl ca-certificates gnupg unzip git sudo nginx
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash - >/dev/null
          apt-get install -y -qq nodejs

          cd /install

          # 1. Generate templated nginx + systemd unit files.
          bash deploy/1build_deploy_files.sh

          # 2. Symlink to /etc/nginx/conf.d + /etc/systemd/system + create /app/<app>.
          bash deploy/2link_files_to_internal_system.sh

          # 3. Stage the static client where nginx serves it from.
          cp -a app/client/. "/app/${APP_NAME}/"

          # 4. Install runtime deps for the bytecoded server.
          # bytenode stays in devDependencies (it's a build tool) but the
          # bytecode loader stubs `require('bytenode')` at runtime, so we
          # install it ad-hoc with --no-save in both server trees. Module
          # resolution from startup/server/*.js stubs and app/server/*.js
          # stubs walks up from each, so each needs its own copy.
          (cd startup/server && npm install --omit=dev 2>&1 | tail -5 && npm install --no-save bytenode 2>&1 | tail -3)
          (cd app/server     && npm install --omit=dev 2>&1 | tail -5 && npm install --no-save bytenode 2>&1 | tail -3)

          # 5. .env for the systemd-managed service. DATABASE_URL points at
          # the postgres sibling container by network alias (test-pg:5432).
          # SECURE_COOKIE must be false here: linux_built_tests serves over
          # plain HTTP from a non-loopback host (the deploy container's name),
          # so the browser's "loopback exception" for Secure cookies doesn't
          # apply and the auth cookie would be silently dropped — login
          # passes but every subsequent request looks unauthenticated.
          # source_tests doesn't need this override because its URLs are
          # http://localhost:*, which IS a secure context.
          # Strategy: strip any existing SECURE_COOKIE line first (dotenv
          # keeps the FIRST occurrence so appending alone is a no-op), then
          # write our override in the CI overrides block. The regex tolerates
          # whitespace around `=` because .env.example currently writes
          # `SECURE_COOKIE = true` with spaces, and a strict `^KEY=` pattern
          # would silently leave the original value in place.
          cp app/server/.env.example app/server/.env
          sed -i -E '/^SECURE_COOKIE[[:space:]]*=/d' app/server/.env
          {
            echo ""
            echo "# CI overrides"
            echo "SECURE_COOKIE=false"
            echo "DATABASE_URL=postgresql://postgres:postgres@${PG_HOST}:5432/${DB_NAME}"
          } >> app/server/.env
          # Belt and braces: print the effective SECURE_COOKIE so the log
          # immediately reveals if the value didn't land (e.g. if .env.example
          # ever introduces a new SECURE_COOKIE format the strip step misses).
          echo "[env] effective SECURE_COOKIE line(s):"
          grep -n '^SECURE_COOKIE' app/server/.env || echo "  (none — that's a bug)"

          # 6. Reload systemd, start the app, reload nginx.
          systemctl daemon-reload
          systemctl enable "${APP_NAME}.service"
          systemctl start "${APP_NAME}.service"

          nginx -t
          # reload-or-restart: nginx isn't auto-started by apt-get install
          # inside the systemd-enabled deploy container (policy-rc.d blocks
          # it), so a plain `reload` fails with "service is not active".
          # reload-or-restart starts it if down, reloads it if up.
          systemctl reload-or-restart nginx

          # 7. Verify the service stayed up. The nginx API-proxy server block
          # is templated with $IP_ADDRESS as server_name (see deploy/base.conf
          # block 3). In CI that's the deploy container's name. Curl by that
          # hostname so the request lands on the right server block — calling
          # `localhost` instead would hit the localhost-only basic_status
          # block (block 2) and 404.
          for i in $(seq 1 15); do
            if curl -fsS "http://${IP_ADDRESS}/api/healthz" > /dev/null; then
              echo "Deployed system healthy"; exit 0
            fi
            sleep 2
          done
          echo "Service failed to come up after deploy. Recent journal:"
          journalctl -u "${APP_NAME}.service" -n 50 --no-pager || true
          exit 1
          INNER_EOF

      - name: Wait for deployed system to be reachable from runner
        # Host header must match the nginx block 3 server_name (templated
        # with $DEPLOY_CONTAINER in the deploy step). On a bare-metal runner
        # APP_URL is http://localhost:$BUILT_HOST_PORT, so without an
        # explicit -H, curl sends Host: localhost — that lands on the
        # localhost-only basic_status block (block 2) and 404s.
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -H "Host: $DEPLOY_CONTAINER" "${APP_URL}/api/healthz" > /dev/null; then
              echo "Reachable from runner at $APP_URL"; exit 0
            fi
            sleep 2
          done
          echo "Deployed system not reachable from runner at $APP_URL"; exit 1

      # ─── Test phases (against the deployed system at $APP_URL) ──────────
      # No explicit seed step here: 02-create-company-admin.spec.ts is the
      # first e2e spec and calls `npm run create-new-company` itself.
      # Pre-seeding from the workflow would cause that spec to hit "user
      # already exists" on its second call and fail — same script,
      # non-idempotent for the user-creation step. source_tests works
      # the same way (no pre-seed), so this keeps the two flows symmetric.
      - name: Smoke — /api/healthz
        run: |
          curl -fsS -H "Host: $DEPLOY_CONTAINER" "${APP_URL}/api/healthz"

      - name: Integration tests
        id: integration
        # Skip cleanly when no specs exist yet (see source_tests for context).
        if: hashFiles('tests/integration-tests/tests/**/*.spec.ts', 'tests/integration-tests/tests/**/*.test.ts') != ''
        continue-on-error: true
        run: npm run test:integration
        working-directory: tests
        env:
          CI: true
          API_BASE_URL: ${{ env.APP_URL }}
          DATABASE_URL: postgresql://postgres:postgres@${{ env.DB_HOST }}:5432/${{ env.DB_NAME }}

      - name: E2E tests
        id: e2e
        continue-on-error: true
        run: npm run test:e2e:ci
        working-directory: tests
        env:
          CI: true
          PW_EXTERNAL_SERVERS: '1'
          FRONTEND_URL: ${{ env.APP_URL }}
          BACKEND_URL: ${{ env.APP_URL }}
          DATABASE_URL: postgresql://postgres:postgres@${{ env.DB_HOST }}:5432/${{ env.DB_NAME }}

      # ─── Capture container logs before tearing down ─────────────────────
      - name: Collect container logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/built"
          docker logs "$DEPLOY_CONTAINER" > "$RUNNER_TEMP/built/deploy-container.log" 2>&1 || true
          docker exec "$DEPLOY_CONTAINER" journalctl -u "${TEST_APP_NAME}.service" -n 500 --no-pager > "$RUNNER_TEMP/built/app-service.log" 2>&1 || true
          docker exec "$DEPLOY_CONTAINER" cat /var/log/nginx/error.log > "$RUNNER_TEMP/built/nginx-error.log" 2>&1 || true
          docker exec "$DEPLOY_CONTAINER" cat /var/log/nginx/access.log > "$RUNNER_TEMP/built/nginx-access.log" 2>&1 || true
          docker logs "$PG_CONTAINER" > "$RUNNER_TEMP/built/postgres.log" 2>&1 || true
          # Pull the winston file logs out of the deploy container. In
          # production NODE_ENV the backend's only log sink is these files
          # (see startup/server/logger.js — Console transport is gated on
          # NODE_ENV !== 'production'), so journalctl above shows only the
          # npm wrapper. Winston uses a relative filename, so logs land in
          # process.cwd()/logs — and the systemd unit's WorkingDirectory is
          # /install/app/server, so that's the only directory that gets logs.
          docker cp "$DEPLOY_CONTAINER:/install/app/server/logs/." "$RUNNER_TEMP/built/winston/" 2>/dev/null || true

      - name: Tear down Postgres + deploy container
        if: always()
        uses: ./.github/actions/postgres-down
        with:
          include_deploy_container: 'true'

      # ─── Artifacts ──────────────────────────────────────────────────────
      - name: Upload smoke + deploy logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux_built_tests_deploy_logs
          path: |
            ${{ runner.temp }}/built/
            _install/deploy/${{ env.TEST_APP_NAME }}.conf
            _install/deploy/${{ env.TEST_APP_NAME }}.service
          if-no-files-found: ignore
          retention-days: 2

      - name: Upload integration + e2e results
        if: always()
        uses: ./.github/actions/upload-test-results
        with:
          mode: built

      - name: Surface phase failures
        if: steps.integration.outcome == 'failure' || steps.e2e.outcome == 'failure'
        run: |
          echo "integration: ${{ steps.integration.outcome }}"
          echo "e2e:         ${{ steps.e2e.outcome }}"
          exit 1
