name: Tests

# Triggered after the build workflow finishes — tests download whatever
# artifacts that run uploaded (no rebuilding here, ever).
on:
  workflow_run:
    workflows: ['Build and Upload Artifacts']
    types: [completed]

defaults:
  run:
    shell: bash

env:
  # The deploy/2link script and the systemd unit name use $APP_NAME.
  # Fixed (not run-id'd) so it's easy to clean up between runs and matches
  # what the deploy scripts expect — they use bash-safe identifiers.
  TEST_APP_NAME: nbnext-ci
  PG_CONTAINER: test-pg
  DEPLOY_CONTAINER: test-deploy
  TEST_NETWORK: test-net
  # Host-mapped port for nginx in built-mode (avoids conflicting with anything
  # on :80 on the runner).
  BUILT_HOST_PORT: '8080'

jobs:
  # ────────────────────────────────────────────────────────────────────
  # Skip everything if the build failed.
  # ────────────────────────────────────────────────────────────────────
  setup:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Cache node dependencies (github-hosted only)
        # Cache via GitHub backend is worth it on ephemeral cloud runners;
        # on self-hosted persistent runners ~/.npm + node_modules already
        # persist between runs, so we skip the network round-trip and let
        # `npm run i` reuse the local cache directly.
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v5
        id: cache-deps
        with:
          path: |
            node_modules
            app/node_modules
            app/client/node_modules
            app/server/node_modules
            startup/client/node_modules
            startup/server/node_modules
            tests/node_modules
            tests/integration-tests/node_modules
            tests/e2e-tests/node_modules
          key: test-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'app/package-lock.json', 'app/client/package-lock.json', 'app/server/package-lock.json', 'startup/client/package-lock.json', 'startup/server/package-lock.json', 'tests/package-lock.json', 'tests/integration-tests/package-lock.json', 'tests/e2e-tests/package-lock.json') }}

      - name: Install node dependencies
        # Self-hosted: cache step skipped → cache-hit '' → install runs.
        # github-hosted: install runs only on cache miss.
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm run i
        env:
          CI: true
          HUSKY: 0

  # ────────────────────────────────────────────────────────────────────
  # SOURCE-MODE TESTS
  # Runs all three test phases (smoke → integration → e2e) against the
  # checked-out source — `node app/server/index.js` + `npm run dev` for the
  # client. Backend stays running across phases (single startup cost).
  # ────────────────────────────────────────────────────────────────────
  tests_source:
    needs: setup
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, Linux, X64]

    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Restore node dependencies (github-hosted only)
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v5
        id: cache-deps
        with:
          path: |
            node_modules
            app/node_modules
            app/client/node_modules
            app/server/node_modules
            startup/client/node_modules
            startup/server/node_modules
            tests/node_modules
            tests/integration-tests/node_modules
            tests/e2e-tests/node_modules
          key: test-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'app/package-lock.json', 'app/client/package-lock.json', 'app/server/package-lock.json', 'startup/client/package-lock.json', 'startup/server/package-lock.json', 'tests/package-lock.json', 'tests/integration-tests/package-lock.json', 'tests/e2e-tests/package-lock.json') }}

      - name: Install node dependencies
        # Self-hosted: always installs (relies on persistent ~/.npm).
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm run i
        env:
          CI: true
          HUSKY: 0

      - name: Cache Playwright browsers (github-hosted only)
        # On self-hosted ~/.cache/ms-playwright persists between runs.
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v5
        id: cache-pw
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/e2e-tests/package-lock.json') }}

      - name: Install Playwright browsers
        # Self-hosted: cache step skipped → installs (idempotent if already there).
        if: steps.cache-pw.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: tests/e2e-tests

      - name: Materialize .env files
        run: node scripts/setup-env.js

      - name: Pre-flight cleanup (remove any stale containers/networks)
        # tests_source and tests_built share $TEST_NETWORK, so a leftover
        # $DEPLOY_CONTAINER from a previous tests_built run will block this
        # job's `network rm` even though tests_source itself never starts one.
        # Nuke both, then force-disconnect any remaining endpoints (including
        # the runner container if a prior run failed before its disconnect
        # step) before removing the network.
        run: |
          for c in "$DEPLOY_CONTAINER" "$PG_CONTAINER"; do
            if docker ps -a --format '{{.Names}}' | grep -qx "$c"; then
              echo "[pre-flight] container '$c' already present — removing for a clean run"
              docker rm -f "$c"
            else
              echo "[pre-flight] container '$c' not present"
            fi
          done
          if docker network ls --format '{{.Name}}' | grep -qx "$TEST_NETWORK"; then
            echo "[pre-flight] network '$TEST_NETWORK' already present — disconnecting endpoints and removing"
            for ep in $(docker network inspect "$TEST_NETWORK" --format '{{range $k,$v := .Containers}}{{println $k}}{{end}}'); do
              echo "[pre-flight]   force-disconnecting endpoint '$ep'"
              docker network disconnect -f "$TEST_NETWORK" "$ep" 2>/dev/null || true
            done
            docker network rm "$TEST_NETWORK"
          else
            echo "[pre-flight] network '$TEST_NETWORK' not present"
          fi

      - name: Resolve unique DB name + network DB host for the runner
        # DB name carries a UTC timestamp + the workflow run id so two runs
        # never collide on a leftover DB if the postgres container ever
        # outlives a single run. Cleanup explicitly DROPs this DB before
        # tearing down the container — belts and braces.
        #
        # DB_HOST: self-hosted runners often run in a container themselves
        # (DooD). When they do, `localhost:5432` is the runner's own loopback,
        # not the host's. Reach postgres by container name on a shared docker
        # network in that case; bare-metal runners use the -p mapping.
        run: |
          DB_NAME="test_db_$(date -u +%Y%m%d_%H%M%S)_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT:-1}"
          echo "DB_NAME=$DB_NAME" >> "$GITHUB_ENV"
          echo "[db] using unique DB name: $DB_NAME"
          docker network create "$TEST_NETWORK"
          if [ -f /.dockerenv ]; then
            RUNNER_CID=$(hostname)
            echo "[network] runner is in container '$RUNNER_CID'; joining $TEST_NETWORK"
            docker network connect "$TEST_NETWORK" "$RUNNER_CID"
            echo "DB_HOST=$PG_CONTAINER" >> "$GITHUB_ENV"
          else
            echo "[network] runner on host; reaching postgres via localhost (-p mapping)"
            echo "DB_HOST=localhost" >> "$GITHUB_ENV"
          fi

      - name: Start Postgres
        run: |
          docker run -d \
            --name "$PG_CONTAINER" \
            --network "$TEST_NETWORK" \
            -p 5432:5432 \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB="$DB_NAME" \
            postgres:15
          # Inside-container readiness (postgres is accepting connections).
          for i in $(seq 1 30); do
            if docker exec "$PG_CONTAINER" pg_isready -U postgres >/dev/null 2>&1; then
              echo "Postgres ready inside container"
              break
            fi
            sleep 1
          done
          # Outside check — the actual concern: can the runner reach it?
          for i in $(seq 1 15); do
            if (echo > /dev/tcp/$DB_HOST/5432) 2>/dev/null; then
              echo "Postgres reachable from runner at $DB_HOST:5432"; exit 0
            fi
            sleep 1
          done
          echo "Postgres NOT reachable from runner at $DB_HOST:5432"
          docker logs "$PG_CONTAINER"
          exit 1

      - name: Start backend (persists across all test phases)
        # Backend FIRST so its startup runs `sequelize.sync()` (because
        # SYNC_DB=true in .env.example) and creates the schema. The seed
        # step below depends on those tables existing.
        run: |
          mkdir -p "$RUNNER_TEMP/source"
          cd app/server
          node index.js > "$RUNNER_TEMP/source/backend.log" 2>&1 &
          echo "BACKEND_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/healthz > /dev/null; then
              echo "Backend up"; exit 0
            fi
            sleep 2
          done
          echo "Backend failed to start. Last 50 lines:"
          tail -n 50 "$RUNNER_TEMP/source/backend.log" || true
          exit 1
        env:
          CI: true
          NODE_ENV: production
          DATABASE_URL: postgresql://postgres:postgres@${{ env.DB_HOST }}:5432/${{ env.DB_NAME }}

      - name: Seed default company + admin user
        # Runs after the backend has come up — by which point sync has
        # created the schema. The seed script now exits non-zero on any
        # error (see startup/server/create_company_with_role_and_perms.js)
        # so a failure here fails the whole job.
        run: |
          # Pull sadmin credentials from tests/e2e-tests/.env so the seed
          # creates the same user the e2e suite later logs in as. The .env
          # is materialized earlier by `node scripts/setup-env.js` from
          # tests/e2e-tests/.env.example — single source of truth, no
          # second copy of the values to drift.
          ENV_FILE=tests/e2e-tests/.env
          TEST_SADMIN_USERNAME=$(grep -E '^TEST_SADMIN_USERNAME=' "$ENV_FILE" | cut -d= -f2-)
          TEST_SADMIN_PASSWORD=$(grep -E '^TEST_SADMIN_PASSWORD=' "$ENV_FILE" | cut -d= -f2-)
          if [ -z "$TEST_SADMIN_USERNAME" ] || [ -z "$TEST_SADMIN_PASSWORD" ]; then
            echo "[seed] missing TEST_SADMIN_USERNAME or TEST_SADMIN_PASSWORD in $ENV_FILE"; exit 1
          fi
          export TEST_SADMIN_USERNAME TEST_SADMIN_PASSWORD
          echo "[seed] credentials sourced from $ENV_FILE:"
          echo "[seed]   TEST_SADMIN_USERNAME=$TEST_SADMIN_USERNAME"
          echo "[seed]   TEST_SADMIN_PASSWORD=$TEST_SADMIN_PASSWORD"
          npm run create-new-company
        env:
          CI: true
          DATABASE_URL: postgresql://postgres:postgres@${{ env.DB_HOST }}:5432/${{ env.DB_NAME }}

      - name: Start frontend (vite dev — persists)
        run: |
          cd app/client
          npx vite --host 127.0.0.1 --port 5173 > "$RUNNER_TEMP/source/frontend.log" 2>&1 &
          echo "FRONTEND_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5173 > /dev/null; then
              echo "Frontend up"; exit 0
            fi
            sleep 2
          done
          echo "Frontend failed to start. Last 50 lines:"
          tail -n 50 "$RUNNER_TEMP/source/frontend.log" || true
          exit 1

      # ─── Test phases (run sequentially against the persistent backend) ───
      - name: Smoke — /api/healthz
        run: curl -fsS http://localhost:3000/api/healthz

      - name: Integration tests
        id: integration
        # Skip cleanly when no specs exist yet — the integration suite ships
        # helpers/actions but is gradually getting its first specs. hashFiles
        # returns '' when nothing matches.
        if: hashFiles('tests/integration-tests/tests/**/*.spec.ts', 'tests/integration-tests/tests/**/*.test.ts') != ''
        continue-on-error: true
        run: npm run test:integration
        working-directory: tests
        env:
          CI: true
          API_BASE_URL: http://localhost:3000
          DATABASE_URL: postgresql://postgres:postgres@${{ env.DB_HOST }}:5432/${{ env.DB_NAME }}

      - name: E2E tests
        id: e2e
        continue-on-error: true
        run: npm run test:e2e:ci
        working-directory: tests
        env:
          CI: true
          # Tells playwright.config.ts to skip its webServer block — the
          # runner has the frontend + backend already running.
          PW_EXTERNAL_SERVERS: '1'
          FRONTEND_URL: http://localhost:5173
          BACKEND_URL: http://localhost:3000
          DATABASE_URL: postgresql://postgres:postgres@${{ env.DB_HOST }}:5432/${{ env.DB_NAME }}

      # ─── Teardown (always) ──────────────────────────────────────────────
      - name: Stop backend + frontend
        if: always()
        run: |
          [ -n "${BACKEND_PID:-}" ] && kill "$BACKEND_PID" 2>/dev/null || true
          [ -n "${FRONTEND_PID:-}" ] && kill "$FRONTEND_PID" 2>/dev/null || true
          # Belt-and-braces for any orphaned vite/node children that survived
          # the parent kill (vite forks from npx; nodemon would do the same).
          pkill -f 'vite' 2>/dev/null || true
          pkill -f 'app/server/index.js' 2>/dev/null || true

      - name: Drop test database
        # Explicit DROP before container removal — defense in depth.
        # `if: always()` ensures it runs even when tests failed; each shell
        # error is suppressed (|| true) so a missing container or already-
        # dropped DB doesn't leave the network/container behind.
        if: always() && env.DB_NAME != ''
        run: |
          if docker ps --format '{{.Names}}' | grep -qx "$PG_CONTAINER"; then
            echo "[cleanup] dropping database '$DB_NAME'"
            docker exec "$PG_CONTAINER" psql -U postgres -c "DROP DATABASE IF EXISTS \"$DB_NAME\";" || true
          else
            echo "[cleanup] postgres container gone — DB '$DB_NAME' already destroyed with it"
          fi

      - name: Stop Postgres + remove network
        if: always()
        run: |
          docker rm -f "$PG_CONTAINER" 2>/dev/null || true
          # Disconnect runner from network first if we joined it.
          if [ -f /.dockerenv ]; then
            docker network disconnect "$TEST_NETWORK" "$(hostname)" 2>/dev/null || true
          fi
          docker network rm "$TEST_NETWORK" 2>/dev/null || true

      # ─── Artifacts (always — most useful on failure) ────────────────────
      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-smoke-logs
          path: |
            ${{ runner.temp }}/source/backend.log
            ${{ runner.temp }}/source/frontend.log
            app/server/logs/
          if-no-files-found: ignore
          retention-days: 2

      - name: Upload integration test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-integration-results
          path: |
            tests/integration-tests/test-results/
            tests/integration-tests/coverage/
            tests/integration-tests/logs/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 2

      - name: Upload e2e test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-e2e-results
          path: |
            tests/e2e-tests/playwright-report/
            tests/e2e-tests/test-results/
            tests/e2e-tests/reports/
            tests/e2e-tests/logs/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 2

      - name: Surface phase failures
        # `continue-on-error` lets each phase keep going so we collect all
        # artifacts; this step fails the job if any phase failed.
        if: steps.integration.outcome == 'failure' || steps.e2e.outcome == 'failure'
        run: |
          echo "integration: ${{ steps.integration.outcome }}"
          echo "e2e:         ${{ steps.e2e.outcome }}"
          exit 1

  # ────────────────────────────────────────────────────────────────────
  # BUILT-MODE TESTS
  # Downloads the bundle artifact from the build run, deploys it inside a
  # privileged systemd-enabled container (running the actual deploy scripts),
  # then runs the same three test phases against the deployed system over
  # nginx + the bytecoded backend.
  # ────────────────────────────────────────────────────────────────────
  tests_built:
    # Sequential after tests_source — both jobs share fixed docker resource
    # names ($PG_CONTAINER, $TEST_NETWORK, $DEPLOY_CONTAINER) and the host's
    # :5432 port. Running in parallel had each job's pre-flight tearing down
    # the other's running containers mid-test.
    needs: tests_source
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, Linux, X64]

    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        # Tests run from the source workspace (we need tests/, package.json,
        # node_modules cache). The deployed system being tested lives inside
        # the deploy container.
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Restore node dependencies (github-hosted only)
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v5
        id: cache-deps
        with:
          path: |
            node_modules
            app/node_modules
            app/client/node_modules
            app/server/node_modules
            startup/client/node_modules
            startup/server/node_modules
            tests/node_modules
            tests/integration-tests/node_modules
            tests/e2e-tests/node_modules
          key: test-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'app/package-lock.json', 'app/client/package-lock.json', 'app/server/package-lock.json', 'startup/client/package-lock.json', 'startup/server/package-lock.json', 'tests/package-lock.json', 'tests/integration-tests/package-lock.json', 'tests/e2e-tests/package-lock.json') }}

      - name: Install node dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm run i
        env:
          CI: true
          HUSKY: 0

      - name: Cache Playwright browsers (github-hosted only)
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v5
        id: cache-pw
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tests/e2e-tests/package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.cache-pw.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: tests/e2e-tests

      - name: Materialize .env files
        run: node scripts/setup-env.js

      - name: Resolve bundle artifact name
        # Mirrors the BUNDLE_NAME logic in builds.yml's site_bundle "meta" step.
        # If that formula changes, change this with it.
        run: |
          VERSION=$(jq -r .version startup/server/package.json)
          SHORT_SHA=$(echo "${{ github.event.workflow_run.head_sha }}" | head -c 7)
          APP_NAME=$(basename "$GITHUB_REPOSITORY")
          BUNDLE_NAME="${APP_NAME}-site-v${VERSION}-${SHORT_SHA}"
          echo "BUNDLE_NAME=$BUNDLE_NAME" >> "$GITHUB_ENV"
          echo "Looking for artifact: $BUNDLE_NAME"

      - name: Download deployment bundle from build run
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.BUNDLE_NAME }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: _install/

      - name: Pre-flight cleanup (remove any stale containers/networks)
        # Force-disconnect any leftover endpoints (including the runner
        # container itself if a prior run failed before its disconnect step)
        # before removing the network — `network rm` errors out if anything
        # is still attached.
        run: |
          for c in "$DEPLOY_CONTAINER" "$PG_CONTAINER"; do
            if docker ps -a --format '{{.Names}}' | grep -qx "$c"; then
              echo "[pre-flight] container '$c' already present — removing for a clean run"
              docker rm -f "$c"
            else
              echo "[pre-flight] container '$c' not present"
            fi
          done
          if docker network ls --format '{{.Name}}' | grep -qx "$TEST_NETWORK"; then
            echo "[pre-flight] network '$TEST_NETWORK' already present — disconnecting endpoints and removing"
            for ep in $(docker network inspect "$TEST_NETWORK" --format '{{range $k,$v := .Containers}}{{println $k}}{{end}}'); do
              echo "[pre-flight]   force-disconnecting endpoint '$ep'"
              docker network disconnect -f "$TEST_NETWORK" "$ep" 2>/dev/null || true
            done
            docker network rm "$TEST_NETWORK"
          else
            echo "[pre-flight] network '$TEST_NETWORK' not present"
          fi

      - name: Resolve unique DB name + runner-reachable hosts
        # DB name carries a UTC timestamp + the run id so two runs never
        # collide on leftover state. Cleanup DROPs the DB explicitly before
        # tearing the container down — belts and braces.
        #
        # DB_HOST + APP_URL: see the same step in tests_source for the full
        # reasoning. DooD-aware runner→sibling-container addressing.
        run: |
          DB_NAME="test_db_$(date -u +%Y%m%d_%H%M%S)_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT:-1}"
          echo "DB_NAME=$DB_NAME" >> "$GITHUB_ENV"
          echo "[db] using unique DB name: $DB_NAME"
          docker network create "$TEST_NETWORK"
          if [ -f /.dockerenv ]; then
            RUNNER_CID=$(hostname)
            echo "[network] runner is in container '$RUNNER_CID'; joining $TEST_NETWORK"
            docker network connect "$TEST_NETWORK" "$RUNNER_CID"
            echo "DB_HOST=$PG_CONTAINER" >> "$GITHUB_ENV"
            # Inside the network, nginx is on the deploy container's :80
            # (the host -p mapping is irrelevant from this side).
            echo "APP_URL=http://$DEPLOY_CONTAINER" >> "$GITHUB_ENV"
          else
            echo "[network] runner on host; reaching siblings via localhost (-p mappings)"
            echo "DB_HOST=localhost" >> "$GITHUB_ENV"
            echo "APP_URL=http://localhost:$BUILT_HOST_PORT" >> "$GITHUB_ENV"
          fi

      - name: Pre-pull postgres image (self-hosted only)
        # Same rationale as the deploy-image pre-pull: on self-hosted the
        # daemon persists, so making the pull explicit turns it into a
        # one-time cost and the log line tells us whether it was cached.
        if: runner.environment != 'github-hosted'
        run: |
          if docker image inspect postgres:15 >/dev/null 2>&1; then
            echo "[pre-pull] postgres:15 already cached locally — skipping pull"
          else
            echo "[pre-pull] postgres:15 not cached — pulling now"
            docker pull postgres:15
          fi

      - name: Start Postgres in test network
        # Both on the test network (so the deploy container reaches it by
        # name as test-pg:5432) AND -p published (so the runner reaches it
        # via $DB_HOST).
        run: |
          docker run -d \
            --name "$PG_CONTAINER" \
            --network "$TEST_NETWORK" \
            -p 5432:5432 \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB="$DB_NAME" \
            postgres:15
          for i in $(seq 1 30); do
            if docker exec "$PG_CONTAINER" pg_isready -U postgres >/dev/null 2>&1; then
              echo "Postgres ready inside container"
              break
            fi
            sleep 1
          done
          # Verify the runner can actually reach it.
          for i in $(seq 1 15); do
            if (echo > /dev/tcp/$DB_HOST/5432) 2>/dev/null; then
              echo "Postgres reachable from runner at $DB_HOST:5432"; exit 0
            fi
            sleep 1
          done
          echo "Postgres NOT reachable from runner at $DB_HOST:5432"
          docker logs "$PG_CONTAINER"
          exit 1

      - name: Pre-pull deploy image (self-hosted only)
        # On self-hosted runners the docker daemon persists across jobs, so
        # making the pull explicit here turns it into a one-time cost: first
        # job pulls, every subsequent job sees the image cached and skips it.
        # On github-hosted runners the daemon is fresh per job — the pull
        # would happen regardless, so there's nothing to gain from doing it
        # in a separate step.
        if: runner.environment != 'github-hosted'
        run: |
          if docker image inspect jrei/systemd-ubuntu:22.04 >/dev/null 2>&1; then
            echo "[pre-pull] jrei/systemd-ubuntu:22.04 already cached locally — skipping pull"
          else
            echo "[pre-pull] jrei/systemd-ubuntu:22.04 not cached — pulling now"
            docker pull jrei/systemd-ubuntu:22.04
          fi

      - name: Start systemd-enabled deploy container
        # Privileged + cgroup mounts let systemd run as PID 1 inside.
        # We do NOT bind-mount _install/ here. Reason: when the runner is
        # itself a container (DooD), bind paths are resolved by the HOST
        # docker daemon, which can't see the runner's filesystem. The bundle
        # is copied in via `docker cp` in the next step instead — that goes
        # through the runner's view of files, so it works in both DooD and
        # bare-metal runner setups.
        run: |
          docker run -d --privileged \
            --name "$DEPLOY_CONTAINER" \
            --network "$TEST_NETWORK" \
            --cgroupns=host \
            --tmpfs /tmp --tmpfs /run --tmpfs /run/lock \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw \
            -p ${BUILT_HOST_PORT}:80 \
            jrei/systemd-ubuntu:22.04
          # Wait until systemd is up enough to accept systemctl calls.
          for i in $(seq 1 30); do
            if docker exec "$DEPLOY_CONTAINER" systemctl is-system-running --wait 2>/dev/null | grep -qE 'running|degraded'; then
              echo "systemd ready"; exit 0
            fi
            sleep 1
          done
          echo "systemd never became ready inside container"
          docker exec "$DEPLOY_CONTAINER" systemctl --no-pager || true
          exit 1

      - name: Copy bundle into the deploy container
        # docker cp reads from the runner's filesystem (which the runner
        # can see) and writes into the container. Avoids the DooD bind-mount
        # trap where -v <runner_path> resolves on the HOST docker daemon to
        # an empty path it doesn't recognize.
        run: |
          docker exec "$DEPLOY_CONTAINER" mkdir -p /install
          docker cp _install/. "$DEPLOY_CONTAINER:/install/"
          # Sanity check — verify the deploy scripts landed where expected.
          docker exec "$DEPLOY_CONTAINER" ls /install/deploy/1build_deploy_files.sh

      - name: Run deploy scripts inside container
        # This is what the human-runbook does on a fresh prod server. If any
        # of the deploy scripts is broken, this step fails — built-mode tests
        # double as the deploy-script regression check.
        run: |
          docker exec -i \
            -e APP_NAME="$TEST_APP_NAME" \
            -e IP_ADDRESS=127.0.0.1 \
            -e SYSTEM_USER=root \
            -e PG_HOST="$PG_CONTAINER" \
            -e DB_NAME="$DB_NAME" \
            "$DEPLOY_CONTAINER" bash <<'INNER_EOF'
          set -euo pipefail

          # Runtime deps: nginx + node 22 + curl/jq/git/sudo/unzip.
          # NodeSource for node 22 — the apt nodejs is older.
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq curl ca-certificates gnupg unzip git sudo nginx
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash - >/dev/null
          apt-get install -y -qq nodejs

          cd /install

          # 1. Generate templated nginx + systemd unit files.
          bash deploy/1build_deploy_files.sh

          # 2. Symlink to /etc/nginx/conf.d + /etc/systemd/system + create /app/<app>.
          bash deploy/2link_files_to_internal_system.sh

          # 3. Stage the static client where nginx serves it from.
          cp -a app/client/. "/app/${APP_NAME}/"

          # 4. Install runtime deps for the bytecoded server.
          # bytenode stays in devDependencies (it's a build tool) but the
          # bytecode loader stubs `require('bytenode')` at runtime, so we
          # install it ad-hoc with --no-save in both server trees. Module
          # resolution from startup/server/*.js stubs and app/server/*.js
          # stubs walks up from each, so each needs its own copy.
          (cd startup/server && npm install --omit=dev 2>&1 | tail -5 && npm install --no-save bytenode 2>&1 | tail -3)
          (cd app/server     && npm install --omit=dev 2>&1 | tail -5 && npm install --no-save bytenode 2>&1 | tail -3)

          # 5. .env for the systemd-managed service. DATABASE_URL points at
          # the postgres sibling container by network alias (test-pg:5432).
          cp app/server/.env.example app/server/.env
          {
            echo ""
            echo "# CI overrides"
            echo "DATABASE_URL=postgresql://postgres:postgres@${PG_HOST}:5432/${DB_NAME}"
          } >> app/server/.env

          # 6. Reload systemd, start the app, reload nginx.
          systemctl daemon-reload
          systemctl enable "${APP_NAME}.service"
          systemctl start "${APP_NAME}.service"

          nginx -t
          # reload-or-restart: nginx isn't auto-started by apt-get install
          # inside the systemd-enabled deploy container (policy-rc.d blocks
          # it), so a plain `reload` fails with "service is not active".
          # reload-or-restart starts it if down, reloads it if up.
          systemctl reload-or-restart nginx

          # 7. Verify the service stayed up.
          for i in $(seq 1 15); do
            if curl -fsS http://localhost/api/healthz > /dev/null; then
              echo "Deployed system healthy"; exit 0
            fi
            sleep 2
          done
          echo "Service failed to come up after deploy. Recent journal:"
          journalctl -u "${APP_NAME}.service" -n 50 --no-pager || true
          exit 1
          INNER_EOF

      - name: Wait for deployed system to be reachable from runner
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "${APP_URL}/api/healthz" > /dev/null; then
              echo "Reachable from runner at $APP_URL"; exit 0
            fi
            sleep 2
          done
          echo "Deployed system not reachable from runner at $APP_URL"; exit 1

      - name: Seed default company + admin user
        # Runs the source-side seed against the same postgres the deployed
        # backend is using.
        run: |
          # Pull sadmin credentials from tests/e2e-tests/.env so the seed
          # creates the same user the e2e suite later logs in as. The .env
          # is materialized earlier by `node scripts/setup-env.js` from
          # tests/e2e-tests/.env.example — single source of truth, no
          # second copy of the values to drift.
          ENV_FILE=tests/e2e-tests/.env
          TEST_SADMIN_USERNAME=$(grep -E '^TEST_SADMIN_USERNAME=' "$ENV_FILE" | cut -d= -f2-)
          TEST_SADMIN_PASSWORD=$(grep -E '^TEST_SADMIN_PASSWORD=' "$ENV_FILE" | cut -d= -f2-)
          if [ -z "$TEST_SADMIN_USERNAME" ] || [ -z "$TEST_SADMIN_PASSWORD" ]; then
            echo "[seed] missing TEST_SADMIN_USERNAME or TEST_SADMIN_PASSWORD in $ENV_FILE"; exit 1
          fi
          export TEST_SADMIN_USERNAME TEST_SADMIN_PASSWORD
          echo "[seed] credentials sourced from $ENV_FILE:"
          echo "[seed]   TEST_SADMIN_USERNAME=$TEST_SADMIN_USERNAME"
          echo "[seed]   TEST_SADMIN_PASSWORD=$TEST_SADMIN_PASSWORD"
          npm run create-new-company
        env:
          CI: true
          DATABASE_URL: postgresql://postgres:postgres@${{ env.DB_HOST }}:5432/${{ env.DB_NAME }}

      # ─── Test phases (against the deployed system at $APP_URL) ──────────
      - name: Smoke — /api/healthz
        run: curl -fsS "${APP_URL}/api/healthz"

      - name: Integration tests
        id: integration
        # Skip cleanly when no specs exist yet (see tests_source for context).
        if: hashFiles('tests/integration-tests/tests/**/*.spec.ts', 'tests/integration-tests/tests/**/*.test.ts') != ''
        continue-on-error: true
        run: npm run test:integration
        working-directory: tests
        env:
          CI: true
          API_BASE_URL: ${{ env.APP_URL }}
          DATABASE_URL: postgresql://postgres:postgres@${{ env.DB_HOST }}:5432/${{ env.DB_NAME }}

      - name: E2E tests
        id: e2e
        continue-on-error: true
        run: npm run test:e2e:ci
        working-directory: tests
        env:
          CI: true
          PW_EXTERNAL_SERVERS: '1'
          FRONTEND_URL: ${{ env.APP_URL }}
          BACKEND_URL: ${{ env.APP_URL }}
          DATABASE_URL: postgresql://postgres:postgres@${{ env.DB_HOST }}:5432/${{ env.DB_NAME }}

      # ─── Capture container logs before tearing down ─────────────────────
      - name: Collect container logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/built"
          docker logs "$DEPLOY_CONTAINER" > "$RUNNER_TEMP/built/deploy-container.log" 2>&1 || true
          docker exec "$DEPLOY_CONTAINER" journalctl -u "${TEST_APP_NAME}.service" -n 500 --no-pager > "$RUNNER_TEMP/built/app-service.log" 2>&1 || true
          docker exec "$DEPLOY_CONTAINER" cat /var/log/nginx/error.log > "$RUNNER_TEMP/built/nginx-error.log" 2>&1 || true
          docker exec "$DEPLOY_CONTAINER" cat /var/log/nginx/access.log > "$RUNNER_TEMP/built/nginx-access.log" 2>&1 || true
          docker logs "$PG_CONTAINER" > "$RUNNER_TEMP/built/postgres.log" 2>&1 || true
          # Pull the winston file logs out of the deploy container. In
          # production NODE_ENV the backend's only log sink is these files
          # (see startup/server/logger.js — Console transport is gated on
          # NODE_ENV !== 'production'), so journalctl above shows only the
          # npm wrapper. Winston uses a relative filename, so logs land in
          # process.cwd()/logs — and the systemd unit's WorkingDirectory is
          # /install/app/server, so that's the only directory that gets logs.
          docker cp "$DEPLOY_CONTAINER:/install/app/server/logs/." "$RUNNER_TEMP/built/winston/" 2>/dev/null || true

      # ─── Teardown (always) ──────────────────────────────────────────────
      - name: Drop test database
        # Explicit DROP before container removal — defense in depth.
        if: always() && env.DB_NAME != ''
        run: |
          if docker ps --format '{{.Names}}' | grep -qx "$PG_CONTAINER"; then
            echo "[cleanup] dropping database '$DB_NAME'"
            docker exec "$PG_CONTAINER" psql -U postgres -c "DROP DATABASE IF EXISTS \"$DB_NAME\";" || true
          else
            echo "[cleanup] postgres container gone — DB '$DB_NAME' already destroyed with it"
          fi

      - name: Stop containers + remove network
        if: always()
        run: |
          docker rm -f "$DEPLOY_CONTAINER" "$PG_CONTAINER" 2>/dev/null || true
          # Disconnect runner from the network first if we joined it.
          if [ -f /.dockerenv ]; then
            docker network disconnect "$TEST_NETWORK" "$(hostname)" 2>/dev/null || true
          fi
          docker network rm "$TEST_NETWORK" 2>/dev/null || true

      # ─── Artifacts ──────────────────────────────────────────────────────
      - name: Upload smoke + deploy logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: built-deploy-logs
          path: |
            ${{ runner.temp }}/built/
            _install/deploy/${{ env.TEST_APP_NAME }}.conf
            _install/deploy/${{ env.TEST_APP_NAME }}.service
          if-no-files-found: ignore
          retention-days: 2

      - name: Upload integration test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: built-integration-results
          path: |
            tests/integration-tests/test-results/
            tests/integration-tests/coverage/
            tests/integration-tests/logs/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 2

      - name: Upload e2e test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: built-e2e-results
          path: |
            tests/e2e-tests/playwright-report/
            tests/e2e-tests/test-results/
            tests/e2e-tests/reports/
            tests/e2e-tests/logs/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 2

      - name: Surface phase failures
        if: steps.integration.outcome == 'failure' || steps.e2e.outcome == 'failure'
        run: |
          echo "integration: ${{ steps.integration.outcome }}"
          echo "e2e:         ${{ steps.e2e.outcome }}"
          exit 1
