name: Sync this app → thenb-in/startup

# Nightly job that replays this app's framework-relevant commits onto the
# `thenb-in/startup` framework repo, per the rules in
# `scripts/sync-startup.js`. The mirror of sync-framework.yml, which pulls
# framework changes back the other way.
#
# This direction pushes, because only the app knows which framework repo it is
# built on — the framework cannot enumerate its apps.
#
# State is the sync branch itself. Each replayed commit carries a
# `Synced-from-<app>: <sha>` trailer, and the newest such trailer reachable
# from the branch IS the resume point, so there is no state tag to drift. The
# branch is long-lived: if its PR sits open, each night appends to it rather
# than cutting a fresh branch that lacks the previous nights' commits.
#
# IMPORTANT: merge these PRs with a MERGE COMMIT, never a squash. A squash
# collapses the per-commit history this design exists to preserve, and eats
# the trailers the resume point is read from.

on:
  schedule:
    # 18:30 UTC = ~midnight IST. Picked to land after `cleanup_artifacts`
    # (15:00 UTC) so the two cron jobs don't fight for self-hosted slots, and
    # an hour before sync-framework.yml pulls back.
    - cron: '30 18 * * *'

  workflow_dispatch:
    inputs:
      start_from_sha:
        description: >
          Override the starting source SHA. Normally unnecessary — the resume
          point is read from the sync branch's own commit trailers.
        required: false
        type: string
      dry_run:
        description: 'Run the sync but do NOT push the branch or open a PR.'
        required: false
        type: boolean
        default: false

concurrency:
  group: sync-startup
  cancel-in-progress: false

jobs:
  sync:
    # This workflow lives under `.github/`, which is a framework path, so the
    # framework repo carries a copy of it. Without this guard it would run
    # there with itself as both source and target, replaying its own commits
    # onto a branch of itself and opening nightly noise PRs. The script
    # guards this too (and exits 0); this avoids burning a runner nightly.
    if: github.repository != 'thenb-in/startup'
    runs-on: ubuntu-latest
    permissions:
      contents: read       # only reads this repo; the push goes to the target
      issues: write        # the sync-failure tracking issue below
      id-token: write      # federate an Octo STS token for thenb-in/startup

    env:
      TARGET_REPO: thenb-in/startup
      TARGET_BASE_BRANCH: main
      SOURCE_BRANCH: main

    steps:
      - name: Checkout this app repo (the sync source)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0  # need full history to walk arbitrary ranges

      - name: Mint a token for thenb-in/startup (Octo STS)
        uses: octo-sts/action@main
        id: octo-sts
        with:
          scope: thenb-in/startup
          identity: app-token
        # No stored secret: this federates the run's own OIDC identity against
        # the trust policy at
        # thenb-in/startup/.github/chainguard/app-token.sts.yaml (any
        # thenb-in/* repo, on main, gets contents:write + pull_requests:write
        # scoped to thenb-in/startup). Token expires in ~1h.

      - name: Checkout target repo (thenb-in/startup)
        uses: actions/checkout@v5
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_BASE_BRANCH }}
          path: target-startup
          fetch-depth: 0
          token: ${{ steps.octo-sts.outputs.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install sync-script dependencies
        # The script only needs `cli-table3`. `--ignore-scripts` keeps husky's
        # prepare step from running on the CI runner.
        run: npm install --no-audit --no-fund --ignore-scripts cli-table3

      - name: Compute sync branch name
        id: branch
        run: |
          set -euo pipefail
          # One standing branch per source app, so the framework repo can take
          # from several apps without them colliding.
          echo "name=sync/from-$(basename "${GITHUB_REPOSITORY}")" >> "$GITHUB_OUTPUT"

      - name: Configure git identity in target repo
        working-directory: target-startup
        run: |
          git config user.name  'startup-sync-bot'
          git config user.email 'startup-sync-bot@users.noreply.github.com'

      - name: Run sync
        id: sync
        env:
          INPUT_START: ${{ inputs.start_from_sha }}
        run: |
          set -euo pipefail
          ARGS=(
            --source-repo="${GITHUB_WORKSPACE}"
            --target-repo="${GITHUB_WORKSPACE}/target-startup"
            --source-branch="${SOURCE_BRANCH}"
            --target-base-branch="${TARGET_BASE_BRANCH}"
            --target-branch="${{ steps.branch.outputs.name }}"
            --log-dir="${GITHUB_WORKSPACE}/sync-logs"
          )
          if [ -n "${INPUT_START}" ]; then
            ARGS+=( --start-from="${INPUT_START}" )
          fi
          node scripts/sync-startup.js "${ARGS[@]}"

      - name: Upload sync logs (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sync-startup-logs-${{ github.run_number }}.${{ github.run_attempt }}
          path: sync-logs/
          if-no-files-found: warn
          retention-days: 30

      - name: Push sync branch + open or update PR
        if: >-
          success() &&
          inputs.dry_run != true &&
          steps.sync.outputs.skipped_same_repo != 'true' &&
          (steps.sync.outputs.has_changes == 'true' || steps.sync.outputs.has_conflicts == 'true')
        working-directory: target-startup
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
          CONFLICTS: ${{ steps.sync.outputs.conflicts }}
          APPLIED: ${{ steps.sync.outputs.commits_applied }}
          SKIPPED: ${{ steps.sync.outputs.commits_skipped }}
          EXAMINED: ${{ steps.sync.outputs.commits_examined }}
          FROM_SHA: ${{ steps.sync.outputs.from_sha }}
          TO_SHA: ${{ steps.sync.outputs.to_sha }}
          FROM_DATE: ${{ steps.sync.outputs.from_date }}
          TO_DATE: ${{ steps.sync.outputs.to_date }}
          PENDING: ${{ steps.sync.outputs.pending_commits }}
          BASE_MERGE_CONFLICT: ${{ steps.sync.outputs.base_merge_conflict }}
        run: |
          set -euo pipefail
          # Retry the push on transient network errors only — git itself is
          # responsible for refusing non-ff, which we don't want to paper over.
          ATTEMPT=1; DELAY=2
          until git push -u origin "${BRANCH}"; do
            if [ "${ATTEMPT}" -ge 5 ]; then
              echo "[push] giving up after ${ATTEMPT} attempts"
              exit 1
            fi
            echo "[push] attempt ${ATTEMPT} failed; retrying in ${DELAY}s"
            sleep "${DELAY}"; ATTEMPT=$((ATTEMPT + 1)); DELAY=$((DELAY * 2))
          done

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          GUIDE_URL="${GITHUB_SERVER_URL}/${TARGET_REPO}/blob/${BRANCH}/scripts/lib/sync/README.md"
          {
            echo "> [!NOTE]"
            echo "> **New to these PRs? Read [Reviewing a sync PR](${GUIDE_URL}) before you review or merge.**"
            echo "> It covers the merge-commit rule, how to resolve a conflict, and what crosses between repos."
            echo ""
            echo "Automated sync from \`${GITHUB_REPOSITORY}\` → \`${TARGET_REPO}\`."
            echo ""
            echo "**Source range:** \`${FROM_SHA:-(bootstrap)}\`..\`${TO_SHA}\` (${FROM_DATE:-?} → ${TO_DATE})"
            echo "**Commits pending on this branch:** ${PENDING}"
            echo "**Commits applied:** ${APPLIED}"
            echo "**Commits skipped:** ${SKIPPED}"
            echo "**Commits examined:** ${EXAMINED}"
            echo "**Unresolved conflicts:** ${CONFLICTS}"
            echo ""
            if [ "${CONFLICTS}" != "0" ]; then
              echo "> [!IMPORTANT]"
              echo "> ${CONFLICTS} file(s) could not be merged automatically and are parked under"
              echo "> \`sync-conflicts/\`. The real file holds the incoming version, so the branch"
              echo "> still builds — but what this repo had is in the \`.conflict\` files, not the"
              echo "> tree. Resolve each: edit the real file, delete its \`.conflict\` file. The"
              echo "> \`sync-conflicts\` check stays red until \`sync-conflicts/\` is empty."
              echo ""
            fi
            if [ "${BASE_MERGE_CONFLICT}" = "true" ]; then
              echo "> [!WARNING]"
              echo "> \`${TARGET_BASE_BRANCH}\` could not be merged into this branch cleanly."
              echo "> Resolve the branch conflict before merging."
              echo ""
            fi
            echo "> [!CAUTION]"
            echo "> **Merge this with a merge commit, not a squash.** A squash destroys the"
            echo "> per-commit history and eats the \`Synced-from-*\` trailers the next run"
            echo "> reads its resume point from."
            echo ""
            echo "Full per-commit log is attached to the workflow run: ${RUN_URL}"
            echo ""
            echo "---"
            echo ""
            echo "Rules applied (from \`scripts/sync-startup.js\`):"
            echo "- Framework paths (\`startup/\`, \`nucleus/\`, \`report_runner/\`, \`lints/\`, \`deploy/\`, \`.github/\`, \`.vscode/\`, \`.husky/\`) always cross, and anchor the commit."
            echo "- Divergent files are three-way merged; only genuinely overlapping edits are parked as conflicts."
            echo "- \`db-scripts/startup/\` rides along on a commit that also touches a framework path."
            echo "- Other paths cross **only if the framework repo already has the file** (no new app files created there)."
            echo "- Merge commits, commits with no framework change, and commits that originated in the framework are skipped."
            echo ""
            echo "Full rules, review steps and conflict-resolution instructions: [scripts/lib/sync/README.md](${GUIDE_URL})"
          } > /tmp/pr-body.md

          # Source repo first: the framework repo receives sync PRs from every
          # app, so the title has to say which one this is at a glance.
          # "through <date>" is the source commit the branch now carries up to,
          # and the count is everything pending on the branch — not just
          # tonight's batch. Together they answer "is this worth opening?" in
          # the PR list, which the opened/updated timestamps do not.
          TITLE="sync: $(basename "${GITHUB_REPOSITORY}") → $(basename "${TARGET_REPO}")"
          if [ -n "${TO_DATE}" ]; then
            [ "${PENDING}" = "1" ] && NOUN=commit || NOUN=commits
            TITLE="${TITLE} (${PENDING} ${NOUN}, through ${TO_DATE})"
          fi

          EXISTING=$(gh pr list --repo "${TARGET_REPO}" --head "${BRANCH}" --state open --json number --jq '.[0].number // empty')
          if [ -z "${EXISTING}" ]; then
            gh pr create \
              --repo "${TARGET_REPO}" \
              --base "${TARGET_BASE_BRANCH}" \
              --head "${BRANCH}" \
              --title "${TITLE}" \
              --body-file /tmp/pr-body.md
          else
            # Standing branch: refresh the existing PR rather than opening a second.
            gh pr edit "${EXISTING}" --repo "${TARGET_REPO}" --title "${TITLE}" --body-file /tmp/pr-body.md
            gh pr comment "${EXISTING}" --repo "${TARGET_REPO}" \
              --body "Nightly sync appended ${APPLIED} commit(s). Unresolved conflicts: ${CONFLICTS}. [Run log](${RUN_URL})"
          fi

          PR=$(gh pr list --repo "${TARGET_REPO}" --head "${BRANCH}" --state open --json number --jq '.[0].number // empty')
          if [ -n "${PR}" ] && [ "${CONFLICTS}" != "0" ]; then
            gh label create sync-conflict --repo "${TARGET_REPO}" --color B60205 \
              --description "Sync PR with unresolved conflicts needing manual reconciliation" \
              --force > /dev/null 2>&1 || true
            gh pr edit "${PR}" --repo "${TARGET_REPO}" --add-label sync-conflict || true
          elif [ -n "${PR}" ]; then
            gh pr edit "${PR}" --repo "${TARGET_REPO}" --remove-label sync-conflict > /dev/null 2>&1 || true
          fi

      - name: Open / close the sync-failure issue
        # A nightly job that fails is invisible: nobody watches the Actions
        # tab. Surface it where work is actually triaged, and reuse one issue
        # per direction rather than filing a fresh one every night. On the
        # next green run the same issue is closed, so an open one always means
        # "the sync is broken right now".
        #
        # This issue lives in THIS repo, so it runs on GITHUB_TOKEN — the STS
        # token above is scoped to the framework repo and cannot file it.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED: ${{ (job.status == 'failure' || steps.sync.outcome == 'failure') && 'true' || 'false' }}
          ISSUE_TITLE: 'Nightly sync is failing: ${{ github.repository }} → ${{ env.TARGET_REPO }}'
        run: |
          set -euo pipefail
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          gh label create sync-failure --color B60205 \
            --description "The nightly repo sync is failing and needs manual attention" \
            --force > /dev/null 2>&1 || true

          EXISTING=$(gh issue list --state open --label sync-failure \
            --search "${ISSUE_TITLE} in:title" \
            --json number,title --jq "map(select(.title == \"${ISSUE_TITLE}\")) | .[0].number // empty")

          if [ "${FAILED}" = "true" ]; then
            BODY=$(printf '%s\n' \
              "The nightly sync run failed, so commits are **not** crossing between these repos." \
              "" \
              "- **Run:** ${RUN_URL}" \
              "- **Direction:** ${{ github.repository }} → ${{ env.TARGET_REPO }}" \
              "" \
              "Until this is fixed the two repos drift apart. The full per-commit log is attached" \
              "to the run as an artifact; it records exactly which commit it stopped on." \
              "" \
              "Re-running is safe — the resume point is read from the sync branch, so nothing is" \
              "replayed twice and nothing needs unpicking by hand. If it names a commit the source" \
              "cannot resolve, re-run the workflow manually with \`start_from_sha\` set." \
              "" \
              "See \`scripts/lib/sync/README.md\` for what the sync does and how to drive it.")
            if [ -z "${EXISTING}" ]; then
              gh issue create --title "${ISSUE_TITLE}" --label sync-failure --body "${BODY}"
            else
              gh issue comment "${EXISTING}" --body "Still failing as of $(date -u +%Y-%m-%d). Run: ${RUN_URL}"
            fi
          elif [ -n "${EXISTING}" ]; then
            gh issue comment "${EXISTING}" --body "Recovered — the sync ran clean. Run: ${RUN_URL}"
            gh issue close "${EXISTING}"
          fi

      - name: Summarize on the run page
        if: always()
        run: |
          if [ -f sync-logs/sync-log.md ]; then
            {
              echo "## Sync run"
              echo ""
              echo "**Target branch:** \`${{ steps.branch.outputs.name }}\`"
              echo ""
              # Just the run-summary table; per-commit detail is in the artifact.
              awk '/## Run summary/,/## Per-commit detail/' sync-logs/sync-log.md | sed '$d'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
