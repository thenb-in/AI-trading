upstream nbnext_app_name_api {
      ip_hash;
      server localhost:3000;
}

# Standalone biometric gateway servers (one process per interface, own port).
# Device protocol traffic is routed to these; operator/admin APIs stay on the
# app upstream above. ZK TCP-pull has NO inbound HTTP (it pulls outbound over
# the ZK SDK on port 4370 / per-terminal pull_port) so it needs no upstream.
upstream nbnext_adms_gateway {
      server localhost:4002;
}
upstream nbnext_biomax_gateway {
      server localhost:4003;
}

server {
      # TODO: test if this is working correctly
      listen 80 default_server;
      location / {
            return 404;
      }
}

server {
      listen 80;
      server_name 127.0.0.1 localhost;

      location /basic_status {
            stub_status on;
            allow 127.0.0.1;   # Allow only local access
            deny all;          # Deny access to others
      }
}

server {
    listen 80;
    server_name public_ip_address;

    set $nbnext_app_path /app/nbnext_app_name;

    # ── Biometric device traffic → standalone gateway servers ────────────
    # Devices speak their protocol on BARE paths. Operator/admin APIs live
    # under /api/ (the app) — note /api/v1/iclock-terminal is the operator API
    # and is intentionally NOT matched here (it stays on the app upstream).
    # nginx uses longest-prefix matching, so these win over `location /`.

    # ADMS / ZK iClock: push (cdata), long-poll (getrequest), device file
    # download (/iclock/file), face-template upload (fdata), etc. → adms_server.
    location /iclock {
            proxy_pass http://nbnext_adms_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;

            client_max_body_size 25m;          # biophoto / fdata uploads
            proxy_connect_timeout 3600;
            proxy_read_timeout    3600;         # long-poll getrequest
            proxy_send_timeout    3600;
            proxy_redirect off;
    }

    # Anviz / Biomax: /hdata + /hdata.aspx (push + receive_cmd poll) → biomax_server.
    location /hdata {
            proxy_pass http://nbnext_biomax_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;

            client_max_body_size 25m;
            proxy_connect_timeout 3600;
            proxy_read_timeout    3600;
            proxy_send_timeout    3600;
            proxy_redirect off;
    }

    location /api/ {
            proxy_pass http://nbnext_app_name_api;
            proxy_connect_timeout      3600;
            proxy_read_timeout         3600;
            proxy_send_timeout         3600;

            # Forward headers
            proxy_set_header Host $host; #localhost:8000; #
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-CSRFToken $http_x_csrf_token;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header Authorization $http_authorization;
            proxy_set_header Referer $http_referer;  # http://localhost:8000; # $http_referer;
            proxy_set_header Origin $http_origin;
            
            # Cookie handling for CSRF
            # proxy_cookie_path / "/";
            # proxy_cookie_domain localhost:8000 3.6.123.135;

            proxy_pass_request_headers on;
            proxy_redirect off;
      }

      location /socket.io/ {
            proxy_pass http://nbnext_app_name_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Origin $http_origin;

            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
      }

      location / {
            root $nbnext_app_path/;
            index index.html;
            try_files $uri /index.html =404;
      }
}