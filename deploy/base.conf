upstream nbnext_app_name_api {
      ip_hash;
      server localhost:8944;
}

# Standalone biometric gateway servers (one process per interface, own port).
# Device protocol traffic is routed to these; operator/admin APIs stay on the
# app upstream above. ZK TCP-pull has NO inbound HTTP (it pulls outbound over
# the ZK SDK on port 4370 / per-terminal pull_port) so it needs no upstream.
upstream nbnext_adms_gateway {
      server localhost:8948;
}
upstream nbnext_biomax_gateway {
      server localhost:8949;
}

# Standalone wagemaster ingest server. High-volume mobile WRITES (location GPS
# tracking + callbuddy call-log/telemetry) are routed here; every other /api/*
# call stays on the app upstream above.
upstream nbnext_wagemaster {
      server localhost:8947;
}

server {
      # TODO: test if this is working correctly
      listen 80 default_server;
      location / {
            return 404;
      }
}

server {
      listen 80;
      server_name 127.0.0.1 localhost;

      location /basic_status {
            stub_status on;
            allow 127.0.0.1;   # Allow only local access
            deny all;          # Deny access to others
      }
}

server {
    listen 80;
    server_name public_ip_address;
    underscores_in_headers on;

    set $nbnext_app_path /app/nbnext_app_name;

    # ── Biometric device traffic → standalone gateway servers ────────────
    # Devices speak their protocol on BARE paths. Operator/admin APIs live
    # under /api/ (the app) — note /api/v1/iclock-terminal is the operator API
    # and is intentionally NOT matched here (it stays on the app upstream).
    # nginx uses longest-prefix matching, so these win over `location /`.

    # ADMS / ZK iClock: push (cdata), long-poll (getrequest), device file
    # download (/iclock/file), face-template upload (fdata), etc. → adms_server.
    location /iclock/ {
            proxy_pass http://nbnext_adms_gateway;
            proxy_connect_timeout      3600;
            proxy_read_timeout         3600;
            proxy_send_timeout         3600;

            # Forward headers
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-CSRFToken $http_x_csrf_token;
            proxy_set_header X-Forwarded-Proto https; # $scheme;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header Authorization $http_authorization;
            proxy_set_header Referer $http_referer;  # http://localhost:8000; # $http_referer;
            proxy_set_header Origin $http_origin;

            # Cookie handling for CSRF
            # proxy_cookie_path / "/";
            # proxy_cookie_domain localhost:8000 3.6.123.135;

            proxy_pass_request_headers on;
            proxy_redirect off;
      }

    # Anviz / Biomax: /hdata + /hdata.aspx (push + receive_cmd poll) → biomax_server.
    location /hdata {
            proxy_pass http://nbnext_biomax_gateway;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            # Biomax devices send protocol metadata in underscored headers.
            # Forward normalized aliases too, so the gateway still sees them
            # if an intermediate proxy strips or rewrites underscore headers.
            proxy_set_header X-Biomax-Dev-Id $http_dev_id;
            proxy_set_header X-Biomax-Cmd-Id $http_cmd_id;
            proxy_set_header X-Biomax-Request-Code $http_request_code;
            proxy_set_header X-Biomax-Cmd-Return-Code $http_cmd_return_code;

            client_max_body_size 25m;
            proxy_connect_timeout 3600;
            proxy_read_timeout    3600;
            proxy_send_timeout    3600;
            proxy_redirect off;
    }

    # ── wagemaster ingest traffic → standalone ingest server ─────────────
    # High-volume mobile WRITES only. These are LONGER prefixes than /api/, so
    # nginx's longest-prefix matching routes them here while every other /api/*
    # call falls through to the app upstream below. Authorization MUST be
    # forwarded — wagemaster verifies the JWT with the shared secret.
    # (GET /api/v1/callbuddy/sync-command intentionally stays on the app — its
    # flag lives in an in-process store shared with the dashboard producer.)
    location ~ ^/api/v1/(location/tracking/update|callbuddy/(sendCallLog|syncPaymentReminder|report-app-version|report-unsynced-count))$ {
            proxy_pass http://nbnext_wagemaster;
            proxy_connect_timeout      3600;
            proxy_read_timeout         3600;
            proxy_send_timeout         3600;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-CSRFToken $http_x_csrf_token;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header Authorization $http_authorization;
            proxy_set_header Referer $http_referer;
            proxy_set_header Origin $http_origin;

            client_max_body_size 25m;   # GPS batches carry base64 tracking images
            proxy_pass_request_headers on;
            proxy_redirect off;
      }

    # ── Service-to-service /internal/* → NEVER exposed at the edge ───────
    # The app mounts internal gateway routes (device-employee, employee,
    # employee-image, canteen-punch) on a bare /internal prefix, outside the
    # public /api/v1 namespace. The only callers are the biometric gateways
    # on THIS host, which reach the app directly on MAIN_APP_URL
    # (http://localhost:8944) and never traverse nginx. So there is no
    # legitimate inbound /internal/ request — deny it outright rather than
    # letting it fall through to `location /` (the SPA) and relying solely on
    # the shared secret. Returns 404, not 403, so the path's existence isn't
    # confirmed to a prober.
    location /internal/ {
            return 404;
      }

    location /api/ {
            proxy_pass http://nbnext_app_name_api;
            proxy_connect_timeout      3600;
            proxy_read_timeout         3600;
            proxy_send_timeout         3600;

            # Forward headers
            proxy_set_header Host $host; #localhost:8000; #
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-CSRFToken $http_x_csrf_token;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header Authorization $http_authorization;
            proxy_set_header Referer $http_referer;  # http://localhost:8000; # $http_referer;
            proxy_set_header Origin $http_origin;

            # Cookie handling for CSRF
            # proxy_cookie_path / "/";
            # proxy_cookie_domain localhost:8000 3.6.123.135;

            proxy_pass_request_headers on;
            proxy_redirect off;
      }

      location /socket.io/ {
            proxy_pass http://nbnext_app_name_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Origin $http_origin;

            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
      }

      # ── SalaryMitra self-service portal → dedicated subpath ──────────────
      # A separate Vite SPA (repo: ios/) built in CI and shipped INSIDE the
      # client bundle at salarymitra/, so on disk it lives at
      # $nbnext_app_path/salarymitra. It has its OWN SPA fallback so deep
      # links (/salarymitra/pay, …) resolve to its index.html instead of
      # falling through to the main app's. Longest-prefix matching makes this
      # win over `location /` for /salarymitra/* requests.
      location = /salarymitra { return 301 /salarymitra/; }
      location /salarymitra/ {
            root $nbnext_app_path/;
            index index.html;
            try_files $uri $uri/ /salarymitra/index.html;
      }

      location / {
            root $nbnext_app_path/;
            index index.html;
            try_files $uri /index.html =404;
      }
}
