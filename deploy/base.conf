upstream nbnext_app_name_api {
      ip_hash;
      server localhost:3000;
}

server {
      # TODO: test if this is working correctly
      listen 80 default_server;
      location / {
            return 404;
      }
}

server {
      listen 80;
      server_name 127.0.0.1 localhost;

      location /basic_status {
            stub_status on;
            allow 127.0.0.1;   # Allow only local access
            deny all;          # Deny access to others
      }
}

server {
    listen 80;
    server_name public_ip_address;
    underscores_in_headers on;

    set $nbnext_app_path /app/nbnext_app_name;

    location /api/ {
            proxy_pass http://nbnext_app_name_api;
            proxy_connect_timeout      3600;
            proxy_read_timeout         3600;
            proxy_send_timeout         3600;

            # Forward headers
            proxy_set_header Host $host; #localhost:8000; #
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-CSRFToken $http_x_csrf_token;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_set_header Authorization $http_authorization;
            proxy_set_header Referer $http_referer;  # http://localhost:8000; # $http_referer;
            proxy_set_header Origin $http_origin;

            # Cookie handling for CSRF
            # proxy_cookie_path / "/";
            # proxy_cookie_domain localhost:8000 3.6.123.135;

            proxy_pass_request_headers on;
            proxy_redirect off;
      }

      location /socket.io/ {
            proxy_pass http://nbnext_app_name_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Origin $http_origin;

            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
      }

      location / {
            root $nbnext_app_path/;
            index index.html;
            try_files $uri /index.html =404;
      }
}
