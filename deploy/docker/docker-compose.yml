# SalaryMitra — Docker install (any OS: Windows, Linux, macOS).
#
# Four containers: the app server, its Postgres, and the two biometric gateways
# the terminals push to (adms on 8948, biomax on 8949 — the app no longer
# reverse-proxies device protocols, so without them a terminal has nowhere to
# send a punch). They are one stack on purpose: install.bat, start.bat,
# status.bat and uninstall.bat are plain `docker compose` on this file, so the
# gateways install, start, update and stop with everything else and there is
# nothing extra for an operator to remember. The app image is ENVIRONMENT
# ONLY (pinned Node + toolchain), built on THIS machine from the Dockerfile at
# the bundle root — the application itself is the Linux bundle (the same artifact
# Ubuntu deploys) this kit ships inside; the bundle root is two levels up and is
# bind-mounted at /srv/app. The container is Linux whatever the host is, so this
# one file works on every OS. The server also serves the client bundle and the
# /salarymitra portal from that mount. Bring it up from this folder with:
#   docker compose up -d --build
# Values come from a `.env` file next to this one (see .env.example); on Windows,
# install.ps1 writes it for you.
#
# State that must survive an update lives in docker_data/, next to this file:
#   docker_data/config/.env               app configuration (seeded on 1st boot)
#   docker_data/config/host_machine.json  host identity the license binds to
#   docker_data/config/secret/            installed license + pinned wallet keys
#   docker_data/uploads/                  face images, bill attachments
#   docker_data/logs/                     winston logs
#   docker_data/backups/                  nightly database dumps
# Back up that one folder and you have the install. The live database is the
# exception — it is in the `db-data` volume; `docker compose down` keeps it,
# `docker compose down -v` destroys it.

name: salarymitra

# Every gateway is the same image as the app — environment only, with the bundle
# bind-mounted at /srv/app — differing solely by which entry it runs and on what
# port. YAML anchors keep that shape in one place: a new interface is a service
# with <<: *gateway plus its own command/port.
x-gateway: &gateway
  image: ${APP_IMAGE:-salarymitra/server:local}
  # This tag exists only because the app service builds it on THIS machine — it
  # is on no registry. Without this, a first `up` on a clean box can try to pull
  # it and fail the whole stack with "pull access denied"; `never` makes compose
  # use the local image the app just built, which is always there by the time a
  # gateway is created (it waits for the app to be healthy).
  pull_policy: never
  restart: unless-stopped
  # Wait for the app to be HEALTHY, not merely started. It is what orders the
  # two: a gateway installs ONLY biometric_gateway/ (APP_ROLE below), and the
  # npm deps it resolves out of app/server and startup/server are put there by
  # the app's own boot, as is config/.env. Healthy also means that install has
  # finished, so nothing races it on the shared /srv/app mount. The cost is that
  # a first `up` does not return until the app answers — several minutes while
  # it installs dependencies and builds the schema.
  depends_on:
    app:
      condition: service_healthy
  volumes:
    - ../../:/srv/app
    - ./docker_data/config:/srv/config
    - ./docker_data/uploads:/srv/data/uploads
    - ./docker_data/logs:/srv/app/app/server/logs

x-gateway-env: &gateway-env
  TZ: ${TZ}
  # Tells the shared entrypoint this container is a gateway, not the app: it
  # installs biometric_gateway/ (with the bytenode the compiled entries need)
  # and stops there — no `app/server npm run deps`, no seeding of config/.env.
  # Both are the app's, and all four containers write to the same bind mount.
  APP_ROLE: gateway
  # The gateway opens its OWN Sequelize pool against the same database as the
  # app. Given here rather than read from docker_data/config/.env because
  # dotenv (loaded by shared/setupAliases from the working directory) never
  # overrides a variable already in the environment — so what compose sets wins,
  # which is what makes PORT below take effect over the app's own PORT=3000.
  DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@db:5432/${DB_NAME}
  # Reached over the project network by service name, not via the published
  # host port — the gateway is a peer of the app, not a client of the edge.
  MAIN_APP_URL: http://app:3000
  # Absolute, because the entrypoint leaves the process in app/server and a
  # relative UPLOADS_DIR would resolve against that instead of the mount.
  UPLOADS_DIR: /srv/data/uploads

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: ${TZ}
    # The one thing not under docker_data/: on Docker Desktop (Windows/macOS) a
    # bind-mounted data dir is owned by root, so Postgres cannot chmod it and
    # refuses to initialise — so it stays in this named volume. Take backups with
    # pg_dump (Windows: backup.bat); a file-level copy of a live data directory
    # will not restore.
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    image: ${APP_IMAGE:-salarymitra/server:local}
    # Built here from the Dockerfile at the bundle root (../..) — env only, no
    # app code baked in. This compose lives in <bundle>/deploy/docker/, so the
    # application bundle is two levels up.
    build:
      context: ../..
      target: runtime
      args:
        # Must match the Node the bundle's .jsc was built with; the entrypoint
        # refuses to boot on a mismatch. install.ps1 sets it in .env from the
        # bundle VERSION; for a manual `up --build`, set it there yourself.
        NODE_VERSION: ${NODE_VERSION:?set NODE_VERSION in .env to the bundle VERSION node_version}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      # SEED_* are read once, by the entrypoint, to write config\.env on first
      # boot. They are deliberately not the app's own variable names: the app
      # must read its config from that file, so editing it actually takes
      # effect (dotenv never overrides a variable already set in the process).
      SEED_DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@db:5432/${DB_NAME}
      SEED_APP_URL: ${APP_URL}
      # A container cannot see the host's NICs or machine-id, so the license
      # binds to what the installer stamped in here. See host-fingerprint.ps1.
      HOST_MACHINE_FILE: /srv/config/host_machine.json
      # Where the installed license token, its seal and the pinned wallet keys
      # are written (env.js exposes it as SECRET_DIR, reading SECRETS_PATH).
      # Unset, it defaults to startup/server/secret INSIDE the bundle - which is
      # not under docker_data/, so the license escapes the one folder the README
      # tells operators to back up, and is DESTROYED by the bundle replacement
      # that an update performs. On Ubuntu the git-overlay update.sh preserves it
      # via startup/server/.gitignore; a Windows file copy has no such rule.
      # Set here rather than in config/.env because it is a fact about the
      # container layout, not an operator choice - same as the two above.
      SECRETS_PATH: /srv/config/secret
    ports:
      - "${APP_PORT}:3000"
    # What status.bat's "(healthy)" and the README's "wait for it" actually mean.
    # node, not curl: the image ships no HTTP client, and adding one for this
    # would be a package to keep patched.
    #
    # start_period is 10 minutes because the boot that matters is the SLOW one:
    # on a first install or after a bundle swap the entrypoint reinstalls every
    # dependency onto a bind mount, then SYNC_DB builds the schema, and nothing
    # answers until that finishes. Measured at ~6 minutes on a Windows host, so
    # a 5-minute window marked a perfectly healthy update "(unhealthy)" for a
    # couple of minutes before it recovered - exactly the false alarm this
    # healthcheck exists to prevent. Failures inside the window are not counted.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/api/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 600s
    # Left of the colon is a folder on THIS machine, right of it is the path
    # inside the container — which is Linux whatever the host is. Everything on
    # the host side is under docker_data/, next to this file.
    volumes:
      # The application IS the bundle this kit ships inside — the bundle root is
      # two levels up. A new build = replace the bundle + restart; node_modules
      # reinstalls when the bundle's commit changes (see container-entrypoint.sh).
      - ../../:/srv/app
      - ./docker_data/config:/srv/config
      - ./docker_data/uploads:/srv/data/uploads
      - ./docker_data/logs:/srv/app/app/server/logs

  # ZK iClock push/pull. Devices POST attendance here, so this port must be
  # reachable from the terminal VLAN — it is published on all interfaces.
  # Point the terminals at this machine on ${ADMS_PORT} (default 8948).
  adms:
    <<: *gateway
    environment:
      <<: *gateway-env
      PORT: 8948
    # Absolute path: container-entrypoint.sh cds to app/server before exec'ing
    # the command, so a relative path would resolve from the wrong directory.
    command: ["node", "/srv/app/biometric_gateway/adms_server/index.js"]
    ports:
      - "${ADMS_PORT:-8948}:8948"
    # node, not curl: the image ships no HTTP client, same as the app's check.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:8948/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

  # Biomax /hdata + /hdata.aspx. Also device-facing, on ${BIOMAX_PORT} (8949).
  biomax:
    <<: *gateway
    environment:
      <<: *gateway-env
      PORT: 8949
    command: ["node", "/srv/app/biometric_gateway/biomax_server/index.js"]
    ports:
      - "${BIOMAX_PORT:-8949}:8949"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:8949/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

volumes:
  db-data:
