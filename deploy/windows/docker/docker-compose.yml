# SalaryMitra — Windows (Docker) install.
#
# Two containers: the app server (bytecode image, also serves the client bundle
# and the /salarymitra portal) and its Postgres. Values come from the `.env`
# file next to this one, which install.ps1 writes — edit it and re-run
# start.bat to change ports, host name or the database password.
#
# State that must survive an update lives in docker_data\, next to this file:
#   docker_data\config\.env               app configuration (seeded on 1st boot)
#   docker_data\config\host_machine.json  host identity the license binds to
#   docker_data\config\secret\            installed license + pinned wallet keys
#   docker_data\uploads\                  face images, bill attachments
#   docker_data\logs\                     winston logs
#   docker_data\backups\                  nightly database dumps
# Back up that one folder and you have the install. The live database is the
# exception — it is in the `db-data` volume; `docker compose down` keeps it,
# `docker compose down -v` destroys it.

name: salarymitra

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: ${TZ}
    # The one thing not under docker_data\: Docker Desktop mounts Windows paths
    # as root, so Postgres cannot chmod its data directory there and refuses to
    # initialise. backup.bat is what puts a restorable copy on the Windows disk,
    # and it is the only safe kind — a file-level copy of a live data directory
    # will not restore.
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    image: ${APP_IMAGE}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      # SEED_* are read once, by the entrypoint, to write config\.env on first
      # boot. They are deliberately not the app's own variable names: the app
      # must read its config from that file, so editing it actually takes
      # effect (dotenv never overrides a variable already set in the process).
      SEED_DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@db:5432/${DB_NAME}
      SEED_APP_URL: ${APP_URL}
      # A container cannot see the host's NICs or machine-id, so the license
      # binds to what the installer stamped in here. See host-fingerprint.ps1.
      HOST_MACHINE_FILE: /srv/config/host_machine.json
    ports:
      - "${APP_PORT}:3000"
    # Left of the colon is a folder on THIS machine, right of it is the path
    # inside the container — which is Linux whatever the host is. Everything on
    # the host side is under docker_data\, next to this file.
    volumes:
      - ./docker_data/config:/srv/config
      - ./docker_data/uploads:/srv/data/uploads
      - ./docker_data/logs:/srv/app/app/server/logs

volumes:
  db-data:
